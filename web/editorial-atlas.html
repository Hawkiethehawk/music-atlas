<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Atlas</title>
<link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico">
<link rel="preload" href="/fonts/EBGaramond.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/fonts/EBGaramond-Italic.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/typography.css">
<style>
:root{
  --bg:#0f0d0a; --bg2:#15120e; --panel:#1a1611; --ink:#eae3d6; --dim:#a39a88; --faint:#6e6759;
  --line:#2b251d; --line2:#3a3226; --acc:#c8622f; --gold:#c9a227;
  --serif:var(--font-stack); --mono:var(--font-stack); --sans:var(--font-stack);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
@supports not (scrollbar-gutter:stable){html{overflow-y:scroll}}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs-18);line-height:1.6;font-variant-numeric:lining-nums;font-size-adjust:0.50;font-variation-settings:"wght" 520;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--acc);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:0 40px;width:100%}
.mono{font-family:var(--mono)}
.kicker{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
.kicker b{color:var(--acc);font-weight:400}
/* header */
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,13,10,.94);backdrop-filter:blur(8px);z-index:50}
.hd{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:var(--serif);font-size:var(--fs-20);letter-spacing:.12em}
.logo em{color:var(--acc);font-style:normal}
nav{display:flex;gap:26px}
nav a{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding:6px 0;border-bottom:1px solid transparent}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);border-bottom-color:var(--acc)}
/* hero */
.hero{padding:34px 0 56px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero h1{font-family:var(--serif);font-weight:500;font-size:var(--fs-52);line-height:1.04;letter-spacing:-.015em;margin:22px 0 26px;max-width:820px}
@media(min-width:1100px){.hero h1{font-size:var(--fs-72)}}
@media(min-width:1500px){.hero h1{font-size:var(--fs-96)}}
.hero h1 em{font-style:italic;color:var(--acc);display:block;margin-top:12px}
.lede{max-width:560px;color:var(--dim);font-size:var(--fs-18);line-height:1.85}
.collage{position:absolute;right:0;top:40px;width:460px;height:400px}
.cc{position:absolute;border:1px solid var(--line2);box-shadow:0 30px 60px rgba(0,0,0,.55)}
.cc .tagline{position:absolute;bottom:8px;left:10px;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.18em;color:rgba(255,255,255,.75)}
/* section head */
.sec{padding:64px 0 30px}
.sec-hd{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:8px}
.sec-hd h2{font-family:var(--serif);font-weight:500;font-size:var(--fs-32);letter-spacing:.01em}
.sec-hd .sub{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.24em;color:var(--faint);text-transform:uppercase}
.sec-hd .more{margin-left:auto;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.18em;color:var(--acc);text-transform:uppercase}
.sec-hd .more:hover{color:var(--ink)}
/* atlas list (editorial index) */
.trow{display:grid;grid-template-columns:56px 92px minmax(230px,0.9fr) 1.7fr 200px;align-items:stretch;border-bottom:1px solid var(--line)}
.trow>*{position:relative;padding:20px 0}
.trow .rank{display:flex;align-items:center;justify-content:flex-end;padding-right:18px;font-family:var(--serif);font-size:var(--fs-36);color:var(--faint);font-style:italic}
.trow .cvgo{cursor:pointer;align-self:center;display:flex}
.trow .info{display:flex;flex-direction:column;justify-content:center;cursor:pointer;padding:20px 18px;gap:6px}
.trow .info::after{content:"";position:absolute;top:0;bottom:0;right:0;width:1px;background:var(--line)}
.trow .info:hover .tt{color:var(--acc)}
.trow .cvgo:hover .ci{color:#fff}
.trow .cvgo:hover ~ .info .tt{color:var(--acc)}
.trow .ol{display:flex;flex-direction:column;justify-content:center;color:var(--dim);font-size:var(--fs-16);line-height:1.6;padding:20px 18px}
.trow .ol::after{content:"";position:absolute;top:0;bottom:0;right:0;width:1px;background:var(--line)}
.trow .plcol{display:flex;flex-direction:column;justify-content:center;padding:20px 0 20px 18px}
.trow .tt{font-family:var(--serif);font-weight:500;font-size:var(--fs-22);line-height:24px;margin:0}
.trow .ar{color:var(--dim);font-size:var(--fs-16);line-height:24px;margin:0}
.trow .ar .alb{font-size:var(--fs-14);color:var(--faint);line-height:24px;margin:0;display:block}
.trow .typechip{margin-bottom:0;transform:translateY(-2px)}
.trow .info>:nth-child(3){transform:translateY(-2px)}
.typechip{display:inline-block;width:fit-content;align-self:flex-start;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.2em;padding:2px 2px 2px calc(2px + .2em);border:1px solid var(--line2);color:var(--dim);margin-bottom:8px}
.typechip.t-style{color:#d99a5b;border-color:#5b4632}
.typechip.t-ext{color:var(--gold);border-color:#5c5220}
.typechip.t-rel{color:#b8a6e8;border-color:#4a3f63}
.typechip.t-exp{color:#7fb8a4;border-color:#33544a}
.plink{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.14em;color:var(--dim);display:block;padding:7px 0;border-top:1px solid var(--line)}
.plink:first-child{border-top:none}
.plink:hover{color:var(--acc)}
/* orbit cards */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:22px 0}
.card{border:1px solid var(--line);background:var(--bg2);cursor:pointer}
.card:hover{border-color:var(--line2)}
.card .cover{height:230px}
.card .cbody{padding:20px 22px 22px}
.card h3{font-family:var(--serif);font-weight:500;font-size:var(--fs-22);margin:8px 0 2px}
.card .car{color:var(--dim);font-size:var(--fs-14)}
.card p{color:var(--dim);font-size:var(--fs-16);line-height:1.7;margin-top:12px}
/* musicians chain */
.chain{border:1px solid var(--line);background:var(--bg2);padding:44px 48px;display:grid;grid-template-columns:1fr 380px;gap:44px;align-items:center;margin:22px 0}
.chainbig{font-family:var(--serif);font-weight:500;font-size:var(--fs-32);line-height:1.2}
.chainstep{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:var(--fs-14);letter-spacing:.12em;color:var(--dim);padding:10px 0}
.chainstep .node{width:9px;height:9px;background:var(--acc);flex:none}
.chainstep .ln{flex:1;border-top:1px dashed var(--line2)}
/* further out */
.outgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:22px 0}
.outcard{border:1px dashed var(--line2);padding:26px;cursor:pointer;position:relative}
.outcard:hover{border-color:#33544a;background:#12100d}
.outcard .ob{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.3em;color:#7fb8a4;margin-bottom:12px}
.outcard h3{font-family:var(--serif);font-weight:500;font-size:var(--fs-24)}
.outcard .car{color:var(--dim);font-size:var(--fs-14);margin-bottom:10px}
.outcard p{color:var(--dim);font-size:var(--fs-16);line-height:1.7}
/* cover */
.cover{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:2px;background:var(--bg);border:1px solid var(--line2)}
.cover:not(.has-img){background:var(--cover-fallback,var(--bg))}
.cover img.cover-img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:cover;opacity:0;transition:opacity .45s ease}
body.covers-ready .cover img.cover-img{opacity:1}
.cover.has-img .ci,.cover.has-img .frame,.cover.has-img .cl{display:none}
.cover .ci{font-family:var(--serif);font-style:italic;font-size:var(--fs-36);color:rgba(255,255,255,.82);text-shadow:0 2px 18px rgba(0,0,0,.5)}
.cover .frame{position:absolute;inset:9px;border:1px solid rgba(255,255,255,.18);z-index:1}
.cover .cl{position:absolute;top:12px;left:13px;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.2em;color:rgba(255,255,255,.65);z-index:1}
.plink.wait{color:var(--faint);pointer-events:none}
.plink.nodata{color:var(--faint)}
/* buttons */
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.16em;text-transform:uppercase;padding:10px 16px;border:1px solid var(--line2);color:var(--dim);cursor:pointer;background:none}
.btn:hover{color:var(--ink);border-color:var(--acc)}
.btn.primary{border-color:var(--acc);color:var(--acc)}
.btn.primary:hover{background:var(--acc);color:#fff}
/* auth buttons in header */
.auth-link{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);background:none;border:1px solid var(--line2);padding:8px 14px;cursor:pointer;transition:color .16s,border-color .16s}
.auth-link:hover{color:var(--ink);border-color:var(--acc)}
.auth-user{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.2em;color:var(--dim);display:flex;align-items:center;gap:22px}
.auth-user button{font:inherit;letter-spacing:.2em;color:var(--dim);background:none;border:0;padding:6px 0;cursor:pointer}
.auth-user button:hover{color:var(--ink)}
/* guest gate */
.gate{flex:1 0 auto;display:flex;align-items:center;padding:56px 0 72px}
.gate-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);gap:56px;align-items:center;width:100%}
.gate-copy{min-width:0}
.gate-kicker{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.28em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:14px}
.gate-kicker b{color:var(--acc);font-weight:400}
.gate-kicker::after{content:"";width:150px;height:1px;background:var(--line)}
.gate h1{font-family:var(--serif);font-weight:500;font-size:clamp(42px,4.6vw,70px);line-height:1.06;letter-spacing:-.015em;margin:26px 0 22px;max-width:840px}
.gate h1 em{font-style:italic;color:var(--acc);display:block;margin-top:10px}
.gate-lede{max-width:520px;color:var(--dim);font-size:var(--fs-18);line-height:1.85}
.gate-points{list-style:none;margin-top:30px;border-top:1px solid var(--line);max-width:560px}
.gate-points li{display:flex;gap:16px;align-items:baseline;border-bottom:1px solid var(--line);padding:13px 0;color:var(--dim);font-size:var(--fs-16)}
.gate-points b{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.18em;color:var(--faint);font-weight:400}
.gate-card{border:1px solid var(--line2);background:var(--bg2);padding:34px 32px;box-shadow:0 36px 90px rgba(0,0,0,.5);position:relative}
.gate-card::before{content:"";position:absolute;top:-1px;left:-1px;right:-1px;height:2px;background:linear-gradient(90deg,var(--acc),transparent 65%)}
.gate-card-kicker{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.24em;color:var(--faint);text-transform:uppercase;margin-bottom:14px}
.gate-card h2{font-family:var(--serif);font-weight:500;font-size:var(--fs-30);margin-bottom:10px}
.gate-card p{color:var(--dim);font-size:var(--fs-14);line-height:1.8}
.gate-actions{display:grid;gap:10px;margin:22px 0 16px}
.gate-actions .btn{width:100%;padding:13px 16px}
.gate-note{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.06em;color:var(--faint);line-height:1.8;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:900px){.gate{padding:34px 0 48px}.gate-grid{grid-template-columns:1fr;gap:30px}.gate h1{font-size:clamp(38px,10vw,54px)}}
/* auth modal */
.auth-backdrop{position:fixed;inset:0;z-index:80;background:rgba(10,8,6,.86);backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;animation:auth-fade .18s ease-out}
.auth-dialog{width:min(460px,100%);border:1px solid var(--line2);background:var(--bg2);box-shadow:0 40px 100px rgba(0,0,0,.6);position:relative;animation:auth-rise .22s ease-out}
.auth-dialog::before{content:"";position:absolute;top:-1px;left:-1px;right:-1px;height:2px;background:linear-gradient(90deg,var(--acc),transparent 65%)}
.auth-head{display:flex;justify-content:space-between;align-items:flex-start;padding:26px 28px 18px}
.auth-head h2{font-family:var(--serif);font-size:var(--fs-30);font-weight:500;margin-top:10px}
.auth-head p{font-family:var(--mono);font-size:var(--fs-12);color:var(--faint);letter-spacing:.06em;margin-top:6px;line-height:1.7}
.auth-close{font-family:var(--serif);font-size:var(--fs-26);line-height:1;color:var(--dim);border:0;background:none;cursor:pointer;padding:2px 6px}
.auth-close:hover{color:var(--acc)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.auth-tab{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.18em;color:var(--faint);border:0;background:none;padding:13px 0;cursor:pointer;position:relative;transition:color .16s}
.auth-tab:hover{color:var(--dim)}
.auth-tab:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.auth-tab.on{color:var(--ink)}
.auth-tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--acc)}
.auth-tab+.auth-tab{border-left:1px solid var(--line)}
.auth-form{display:grid;gap:16px;padding:24px 28px 28px}
.auth-field{display:grid;gap:7px}
.auth-field label{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.auth-field input{font:inherit;font-family:var(--mono);font-size:var(--fs-14);color:var(--ink);background:var(--panel);border:1px solid var(--line2);padding:12px 13px;outline:none;transition:border-color .16s}
.auth-field input:focus{border-color:var(--acc)}
.auth-input{position:relative;display:block}
.auth-input input{width:100%;padding-right:64px}
.auth-remember{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.08em;color:var(--dim);cursor:pointer;user-select:none;margin:-2px 0 2px}
.auth-remember input{-webkit-appearance:none;appearance:none;width:15px;height:15px;border:1px solid var(--line2);background:var(--panel);margin:0;cursor:pointer;position:relative;flex:none;transition:border-color .16s,background .16s}
.auth-remember input:hover{border-color:var(--acc)}
.auth-remember input:checked{border-color:var(--acc);background:var(--acc)}
.auth-remember input:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.auth-remember input:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.auth-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.14em;color:var(--faint);background:none;border:0;cursor:pointer;padding:4px}
.auth-eye:hover{color:var(--acc)}
.auth-message{font-family:var(--mono);font-size:var(--fs-12);line-height:1.7;color:var(--dim);min-height:18px}.auth-message.error{color:#d98a7a}.auth-message.ok{color:#8fce9b}
.auth-form .btn{width:100%;min-height:46px}
@keyframes auth-fade{from{opacity:0}to{opacity:1}}
@keyframes auth-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.auth-backdrop,.auth-dialog{animation:none}}
/* article / detail */
.crumb{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.2em;color:var(--faint);padding:26px 0 0;text-transform:uppercase}
.crumb a:hover{color:var(--acc)}
.dgrid{display:grid;grid-template-columns:320px 1fr;gap:52px;padding:30px 0 70px}
.dcover{border:1px solid var(--line2);height:320px;box-shadow:0 40px 80px rgba(0,0,0,.5)}
.dtitle{font-family:var(--serif);font-weight:500;font-size:var(--fs-44);line-height:1.1;margin:8px 0 6px}
.dsub{color:var(--dim);font-size:var(--fs-18);margin-bottom:20px}
.metatab{font-family:var(--mono);font-size:var(--fs-12);color:var(--dim);border-top:1px solid var(--line);margin:20px 0}
.metatab div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.metatab span{color:var(--faint);letter-spacing:.14em;text-transform:uppercase;font-size:var(--fs-12)}
.metatab a:hover{color:var(--acc)}
/* interest island meta (fixed label column + one item per line) */
.interest-meta{border-top:1px solid var(--line);margin:20px 0}
.interest-meta>div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.interest-meta>div>span{color:var(--faint);letter-spacing:.14em;text-transform:uppercase;font-size:var(--fs-12);white-space:nowrap;padding-top:2px}
.interest-meta .meta-line{font-family:var(--mono);font-size:var(--fs-12);color:var(--dim);line-height:1.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.interest-meta .meta-line+.meta-line{margin-top:2px}
.interest-meta a{color:var(--dim)}
.interest-meta a:hover{color:var(--acc)}
.artist-groups{display:grid;gap:16px;min-width:0}
.artist-group{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start;min-width:0}
.artist-name{font-size:var(--fs-14);color:var(--ink);line-height:1.6;white-space:normal;overflow-wrap:anywhere}
.artist-name a:hover{color:var(--acc)}
.artist-tracks{display:grid;gap:2px;min-width:0}
@media(max-width:700px){.artist-group{grid-template-columns:1fr;gap:4px}}
/* island sources list */
.island-sources{margin:16px 0 0;border-top:1px solid var(--line)}
.island-sources summary{cursor:pointer;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;padding:12px 0;list-style:none;display:flex;align-items:center;gap:8px}
.island-sources summary::-webkit-details-marker{display:none}
.island-sources summary::before{content:"▸";color:var(--faint);transition:transform .16s}
.island-sources[open] summary::before{transform:rotate(90deg)}
.island-sources summary:hover{color:var(--ink)}
.source-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 0 12px}
.source-sizes{display:flex;gap:6px}
.source-size{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.1em;color:var(--faint);background:none;border:1px solid var(--line);padding:5px 10px;cursor:pointer;transition:color .16s,border-color .16s,background .16s}
.source-size:hover{color:var(--ink)}
.source-size.on{color:var(--acc);border-color:var(--acc);background:rgba(200,98,47,.12)}
.source-pager{display:flex;align-items:center;gap:10px}
.source-page{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.1em;color:var(--dim);background:none;border:1px solid var(--line2);padding:5px 10px;cursor:pointer;transition:color .16s,border-color .16s}
.source-page:not(:disabled):hover{color:var(--ink);border-color:var(--acc)}
.source-page.on{color:var(--acc);border-color:var(--acc);background:rgba(200,98,47,.12)}
.source-page:disabled{opacity:.35;cursor:not-allowed}
.source-page-info{font-family:var(--mono);font-size:var(--fs-12);color:var(--faint)}
.source-list{border-top:1px solid var(--line)}
.source-row{display:grid;grid-template-columns:96px minmax(0,1fr) 120px;gap:16px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line);transition:background .16s}
.source-row:hover{background:var(--bg2)}
.source-rank{font-family:var(--mono);font-size:var(--fs-12);color:var(--faint);padding-top:2px;text-align:right}
.source-title{font-size:var(--fs-14);color:var(--ink);line-height:1.5}
.source-artist{font-family:var(--mono);font-size:var(--fs-12);color:var(--dim);margin-top:3px}
.source-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.source-tag{font-family:var(--mono);font-size:var(--fs-12);color:var(--dim);border:1px solid var(--line2);padding:3px 8px;white-space:nowrap}
.source-tag.rest{color:var(--dim)}
.source-tag.more{color:var(--faint);border-style:dashed;cursor:pointer;position:relative}
.source-tag.more:hover::after{content:attr(data-rest);position:absolute;right:0;bottom:calc(100% + 8px);z-index:30;background:var(--panel);border:1px solid var(--line2);box-shadow:0 18px 40px rgba(0,0,0,.55);color:var(--dim);font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.04em;padding:8px 10px;white-space:normal;width:max-content;max-width:320px;line-height:1.8;text-align:left}
.source-tag.more:hover::before{content:"";position:absolute;right:12px;bottom:calc(100% + 2px);border:5px solid transparent;border-top-color:var(--line2)}
.source-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.source-scope{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.12em;color:var(--faint);border:1px solid var(--line);padding:3px 8px;white-space:nowrap}
.source-link{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.08em;color:var(--dim);white-space:nowrap}
.source-link:hover{color:var(--acc)}
@media(max-width:820px){.source-row{grid-template-columns:36px minmax(0,1fr)}.source-side{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}}
.explain{font-size:var(--fs-18);line-height:1.9;color:var(--ink);max-width:620px}
.quoted{border-left:2px solid var(--acc);padding-left:18px;font-family:var(--serif);font-size:var(--fs-20);line-height:1.7;font-style:italic;color:var(--ink)}
/* why layers */
.layer{padding:34px 0;border-top:1px solid var(--line)}
.layer .lnum{font-family:var(--serif);font-style:italic;font-size:var(--fs-18);color:var(--acc);margin-bottom:6px}
.layer h3{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.26em;text-transform:uppercase;color:var(--dim);margin-bottom:16px}
/* taste connection */
.tconn{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.tnode{border:1px solid var(--line2);background:var(--bg2);padding:14px 18px;min-width:170px}
.tnode .tk{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.22em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
.tnode .tv{font-family:var(--serif);font-size:var(--fs-16);line-height:1.35}
.tnode.cur{border-color:var(--acc)}
.tnode.cur .tv{color:var(--acc);font-style:italic}
.tarrow{display:flex;align-items:center;padding:0 12px;color:var(--faint);font-family:var(--mono)}
/* route */
.routelist{max-width:560px}
.rstep{display:flex;gap:16px;align-items:flex-start}
.rstep .rk{width:22px;font-family:var(--mono);font-size:var(--fs-12);color:var(--acc);padding-top:3px;text-align:center;flex:none}
.rstep .rv{padding:0 0 4px}
.rstep .rv .l1{font-size:var(--fs-18)}
.rstep .rv .l2{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
.rline{width:22px;display:flex;justify-content:center;color:var(--faint);font-family:var(--mono);font-size:var(--fs-12);padding:0 0 10px}
/* evidence */
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.evcard{border:1px solid var(--line2);background:var(--panel);padding:18px 20px}
.evcard .ek{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.26em;color:var(--acc);text-transform:uppercase;margin-bottom:10px}
.evcard .ep{font-family:var(--serif);font-size:var(--fs-16);margin-bottom:8px}
.evcard .ed{color:var(--dim);font-size:var(--fs-14);line-height:1.65;margin-bottom:12px}
.evmeta{font-family:var(--mono);font-size:var(--fs-12);color:var(--faint);letter-spacing:.1em;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.badge{padding:2px 8px;border:1px solid;letter-spacing:.14em;text-transform:uppercase;font-size:var(--fs-12)}
.b-confirmed{color:#8fce9b;border-color:#2f4a35}
.b-has-source{color:#9db8d9;border-color:#33415a}
.b-pending{color:#d9b96a;border-color:#57491f}
.b-speculative{color:#d98a7a;border-color:#572d24}
.b-computed{color:var(--dim);border-color:var(--line2)}
/* axes */
.axbar{display:grid;grid-template-columns:150px 1fr 40px;gap:14px;align-items:center;margin:7px 0;font-family:var(--mono);font-size:var(--fs-12)}
.axbar .an{color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.axbar .tr{height:3px;background:var(--line)}
.axbar .fl{height:3px;background:var(--acc)}
.axbar .av{color:var(--faint);text-align:right}
/* taste map */
.islands{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:26px 0 60px}
.island{border:1px solid var(--line);background:var(--bg2);padding:26px}
.island .code{font-family:var(--serif);font-style:italic;font-size:var(--fs-18);color:var(--acc)}
.island h3{font-family:var(--serif);font-weight:500;font-size:var(--fs-26);margin:4px 0 10px}
.island .genres{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.16em;color:var(--dim);text-transform:uppercase;line-height:2;margin-bottom:14px}
.island p{color:var(--dim);font-size:var(--fs-14);line-height:1.7;margin-bottom:16px}
.island .rep{font-family:var(--mono);font-size:var(--fs-12);color:var(--faint);line-height:2;border-top:1px solid var(--line);padding-top:12px}
.island:hover{border-color:var(--line2);cursor:pointer}
.disclaim{border:1px dashed var(--line2);padding:16px 20px;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.1em;color:var(--faint);margin-bottom:50px}
/* sources */
.srccard{border:1px solid var(--line);background:var(--bg2);padding:24px 26px;display:grid;grid-template-columns:1fr auto;gap:20px;margin-bottom:16px}
.srccard h3{font-family:var(--serif);font-weight:500;font-size:var(--fs-20)}
.srccard .via{font-family:var(--mono);font-size:var(--fs-12);color:var(--faint);letter-spacing:.1em;margin:6px 0 12px}
.srccard .st{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.18em;padding:4px 10px;border:1px solid #2f4a35;color:#8fce9b;display:inline-block}
.srccard .st.archived{border-color:var(--line2);color:var(--faint)}
.flow{border:1px solid var(--line2);background:var(--panel);padding:26px;margin:18px 0 26px;display:none}
.flow.on{display:block}
.workflow-panel{border:1px solid var(--line2);background:var(--bg2);padding:26px;margin:26px 0 18px}
.workflow-panel h3{font-family:var(--serif);font-size:var(--fs-24);font-weight:500;margin-bottom:6px}
.workflow-panel .hint{color:var(--dim);font-size:var(--fs-14);line-height:1.7;margin-bottom:18px}
.wf-form{display:grid;grid-template-columns:1fr;gap:14px}
.wf-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.wf-field label{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.wf-field input,.wf-field select{font:inherit;font-family:var(--mono);font-size:var(--fs-14);color:var(--ink);background:var(--panel);border:1px solid var(--line2);padding:10px 12px;min-height:42px;outline:none}
.wf-field input:focus,.wf-field select:focus{border-color:var(--acc)}
.wf-field.has-error label{color:#d99a5b}
.wf-field input[aria-invalid="true"]{border-color:var(--acc);box-shadow:inset 0 -1px 0 var(--acc)}
.wf-error{display:none;border-left:2px solid var(--acc);background:rgba(200,98,47,.08);color:#d99a5b;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.08em;line-height:1.5;padding:6px 10px}
.wf-field.has-error .wf-error{display:block}
.wf-field.hidden{display:none}
.wf-limit-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wf-limit-row input{width:150px}
.wf-chips{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.wf-chips .chip{flex:1 1 0;min-width:0;text-align:center;white-space:nowrap}
.wf-limit-note{font-family:var(--mono);font-size:var(--fs-12);color:var(--faint);letter-spacing:.08em;line-height:1.7}
.chip{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.14em;padding:8px 12px;border:1px solid var(--line);color:var(--dim);cursor:pointer;background:none;transition:border-color .16s,color .16s,background .16s}
.chip:hover:not(:disabled):not(.on){border-color:var(--line2);color:var(--ink)}
.chip.on{border-color:var(--acc);color:var(--acc);background:rgba(200,98,47,.12)}
.chip.on:hover:not(:disabled){border-color:var(--acc);color:var(--acc);background:rgba(200,98,47,.2)}
.chip:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.chip:disabled{opacity:.35;cursor:not-allowed}
.wf-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wf-actions .btn{min-height:42px;white-space:nowrap}
.wf-actions .btn.hidden{display:none}
.wf-actions .btn:disabled{opacity:.45;cursor:not-allowed}
.wf-meta{font-family:var(--mono);font-size:var(--fs-12);color:var(--faint);letter-spacing:.08em;margin-top:14px;line-height:1.8}
.fstep{font-family:var(--mono);font-size:var(--fs-14);color:var(--faint);padding:9px 0;letter-spacing:.06em}
.fstep.done{color:var(--ink)}
.fstep.failed{color:#d98a7a}
.fstep.failed::before{content:"! ";color:#d98a7a}
.fstep.done::before{content:"— ";color:var(--acc)}
.fstep::before{content:"· "}
.wf-dashboard{display:grid;gap:18px}
.wf-stagebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:14px}
.wf-stage{min-width:0;border-top:2px solid var(--line2);padding-top:8px;color:var(--faint);font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.08em}
.wf-stage.current{border-top-color:var(--acc);color:var(--acc)}
.wf-stage.done{border-top-color:#70947d;color:var(--ink)}
.wf-stage.reused{border-top-color:#6f8fa8;color:var(--ink)}
.wf-stage.failed{border-top-color:#b45f52;color:#d98a7a}
.wf-stage-index{display:block;font-size:var(--fs-12);color:var(--faint);margin-bottom:3px}
.wf-stage.current .wf-stage-index{color:var(--acc)}
.wf-stage.done .wf-stage-index{color:#8fce9b}
.wf-stage.reused .wf-stage-index{color:#90b7d0}
.wf-stage.failed .wf-stage-index{color:#d98a7a}
.wf-stage-label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-stage-state{display:block;margin-top:3px;color:var(--faint);font-size:var(--fs-12);letter-spacing:.04em}
.wf-stage.current .wf-stage-state{color:#d99a5b}
.wf-stage.done .wf-stage-state{color:#8fce9b}
.wf-stage.reused .wf-stage-state{color:#90b7d0}
.wf-stage.failed .wf-stage-state{color:#d98a7a}
.wf-summary{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:13px;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.06em;color:var(--dim)}
.wf-summary-main{color:var(--ink)}
.wf-summary-count{color:var(--acc)}
.wf-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wf-task-panel{min-width:0;border:1px solid var(--line);padding:16px 18px;background:rgba(0,0,0,.08)}
.wf-stage-panels{display:grid;gap:10px}
.wf-stage-panel{border:1px solid var(--line);background:rgba(0,0,0,.08)}
.wf-stage-panel>summary{display:flex;align-items:baseline;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;padding:14px 16px;font-family:var(--serif);font-size:var(--fs-18);color:var(--ink)}
.wf-stage-panel>summary::-webkit-details-marker{display:none}
.wf-stage-panel>summary::before{content:"＋";font-family:var(--mono);font-size:var(--fs-14);color:var(--faint);margin-right:8px}
.wf-stage-panel[open]>summary::before{content:"－";color:var(--acc)}
.wf-stage-panel.current{border-color:var(--acc)}
.wf-stage-panel.done{border-color:#70947d}
.wf-stage-panel.reused{border-color:#6f8fa8}
.wf-stage-panel.failed{border-color:#b45f52}
.wf-stage-panel-body{border-top:1px solid var(--line);padding:14px 16px 16px}
.wf-stage-panel-state{font-family:var(--mono);font-size:var(--fs-12);color:var(--faint);white-space:nowrap}
.wf-stage-panel.current .wf-stage-panel-state{color:#d99a5b}
.wf-stage-panel.done .wf-stage-panel-state{color:#8fce9b}
.wf-stage-panel.reused .wf-stage-panel-state{color:#90b7d0}
.wf-stage-panel.failed .wf-stage-panel-state{color:#d98a7a}

.wf-panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:9px}
.wf-panel-head h4{font-family:var(--serif);font-weight:500;font-size:var(--fs-18);color:var(--ink)}
.wf-panel-stat{font-family:var(--mono);font-size:var(--fs-12);color:var(--acc);white-space:nowrap}
.wf-panel-note{padding:10px 0 8px;color:var(--dim);font-family:var(--mono);font-size:var(--fs-12);line-height:1.7}
.wf-task-list{border-top:1px solid var(--line)}
.wf-task-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:var(--fs-12);color:var(--dim)}
.wf-task-row:last-child{border-bottom:0}
.wf-task-name{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-task-detail{display:block;color:var(--faint);font-size:var(--fs-12);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-task-state{color:var(--faint);white-space:nowrap}
.wf-task-row.running .wf-task-state{color:#d99a5b}
.wf-task-row.done .wf-task-state{color:#8fce9b}
.wf-task-row.failed .wf-task-state{color:#d98a7a}
.wf-task-row.waiting{opacity:.62}
.wf-task-row.reused .wf-task-state{color:#90b7d0}
.wf-task-row.skipped .wf-task-state{color:var(--faint)}
.wf-task-row.skipped{opacity:.7}
.wf-terminal-error{display:none;border:1px solid #6d3b34;background:rgba(180,95,82,.08);padding:12px 14px;color:#d98a7a;font-family:var(--mono);font-size:var(--fs-12);line-height:1.7}
.wf-terminal-error.on{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wf-log-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wf-log-button{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.1em;color:var(--dim);border:1px solid var(--line2);background:none;padding:7px 10px;cursor:pointer}
.wf-log-button:hover{color:var(--ink);border-color:var(--acc)}
.wf-log-panel{border:1px solid var(--line);background:#17140f;padding:14px;max-height:360px;overflow:auto}
.wf-log-panel.hidden{display:none}
.wf-log-panel pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:var(--fs-12);line-height:1.65;color:var(--dim)}
@media (max-width:900px){.wf-detail-grid{grid-template-columns:1fr}}
.grp{margin:30px 0}
.grp h4{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.26em;color:var(--faint);text-transform:uppercase;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sres{display:flex;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sres:hover{background:var(--bg2)}
.sres .t{font-family:var(--serif);font-size:var(--fs-18)}
.sres .a{color:var(--dim);font-size:var(--fs-14)}
/* tracklist */
.trk{display:flex;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:var(--fs-14);cursor:pointer}
.trk:hover{background:var(--bg2)}
.trk .n{font-family:var(--mono);color:var(--faint);width:26px;font-size:var(--fs-12);padding-top:2px}
.trk.reco .t{color:var(--acc)}
.trk .t{font-family:var(--serif);font-size:var(--fs-16)}
.trk .why{margin-left:auto;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.2em;color:var(--gold);align-self:center}
/* filter tabs */
.tabs{display:flex;gap:8px;padding:20px 0 8px;flex-wrap:wrap}
.tab{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.18em;text-transform:uppercase;padding:8px 14px;border:1px solid var(--line);color:var(--dim);cursor:pointer;transition:border-color .16s,color .16s,background .16s}
.tab:hover:not(.on){border-color:var(--line2);color:var(--ink)}
.tab.on{border-color:var(--acc);color:var(--acc);background:rgba(200,98,47,.12)}
.tab.on:hover{border-color:var(--acc);color:var(--acc);background:rgba(200,98,47,.2)}
.tab.empty{opacity:.55}
.tab:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
/* settings */
.header-tools{display:flex;align-items:center;gap:22px}
.settings-trigger{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.16em;color:var(--dim);background:none;border:1px solid var(--line2);padding:6px 10px;cursor:pointer}
.settings-trigger:hover{color:var(--ink);border-color:var(--acc)}
.settings-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:grid;place-items:center;padding:24px}
.settings-dialog{width:min(900px,100%);max-height:min(90vh,820px);overflow:hidden;background:var(--bg2);border:1px solid var(--line2);box-shadow:0 24px 80px rgba(0,0,0,.55);display:flex;flex-direction:column}
.settings-head{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding:26px 26px 16px}
.settings-head h2{font-family:var(--serif);font-weight:500;font-size:var(--fs-30)}
.settings-head p,.settings-note{color:var(--dim);font-family:var(--mono);font-size:var(--fs-12);line-height:1.7;letter-spacing:.04em}
.settings-close{font-family:var(--mono);font-size:var(--fs-18);color:var(--dim);background:none;border:0;cursor:pointer;padding:0 4px}
.settings-close:hover{color:var(--acc)}
.settings-section{border-top:1px solid var(--line);padding:18px 0 4px}
.settings-section:first-child{border-top:0;padding-top:0}
.settings-section h3{font-family:var(--serif);font-size:var(--fs-20);font-weight:500;margin-bottom:12px}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.settings-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.settings-field.wide{grid-column:1/-1}
.settings-field label{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.1em;color:var(--faint)}
.settings-field input,.settings-field textarea{font:inherit;font-family:var(--mono);font-size:var(--fs-14);color:var(--ink);background:var(--panel);border:1px solid var(--line2);padding:9px 10px;min-height:39px;outline:none}
.settings-field textarea{resize:vertical;line-height:1.5}
.settings-field input:focus,.settings-field textarea:focus{border-color:var(--acc)}
.settings-check{display:flex;align-items:center;gap:9px;min-height:39px;color:var(--dim);font-family:var(--mono);font-size:var(--fs-12)}
.settings-check input{accent-color:var(--acc)}
.settings-key-row{display:flex;align-items:center;gap:8px}
.settings-key-row input{flex:1;min-width:0}
.settings-key-row .btn{min-height:39px;white-space:nowrap}
.settings-form{display:flex;flex-direction:column;min-height:0;flex:1}
.settings-body{flex:1;min-height:0;overflow:auto;padding:18px 26px 4px}
/* account center */
.account-tabs{flex:none;display:flex;gap:8px;border-bottom:1px solid var(--line);padding:0 26px}
.account-tab{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.18em;color:var(--faint);background:none;border:0;border-bottom:1px solid transparent;padding:12px 4px;cursor:pointer;transition:color .16s,border-color .16s}
.account-tab:hover{color:var(--dim)}
.account-tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.account-section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.account-section:first-child{border-top:0;padding-top:4px;margin-top:0}
.account-section h3{font-family:var(--serif);font-weight:500;font-size:var(--fs-22);margin-bottom:4px}
.account-note{color:var(--dim);font-family:var(--mono);font-size:var(--fs-12);line-height:1.7;letter-spacing:.04em;margin-bottom:12px}
.account-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-family:var(--mono);font-size:var(--fs-12);color:var(--dim)}
.account-meta span{color:var(--faint);margin-right:8px}
.account-table{width:100%;border-collapse:collapse;font-size:var(--fs-14)}
.account-table th,.account-table td{text-align:left;border-top:1px solid var(--line);padding:10px 8px;vertical-align:middle}
.account-table th{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.12em;color:var(--faint);font-weight:400;text-transform:uppercase}
.my-history-item{border-top:1px solid var(--line);padding:12px 0}
.my-history-item:first-child{border-top:0;padding-top:0}
.my-history-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.history-entries{margin-top:6px}
.history-entries summary{cursor:pointer;font-family:var(--mono);font-size:var(--fs-12);color:var(--faint);letter-spacing:.08em}
.history-entries summary:hover{color:var(--dim)}
.history-entry{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:var(--fs-12);color:var(--dim);padding:4px 0}
.history-entry .btn{margin-left:auto}
@media(max-width:700px){.account-meta{grid-template-columns:1fr}.account-table{display:block;overflow:auto;white-space:nowrap}}
.settings-actions{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:18px 26px;background:var(--bg2)}
.settings-message{color:var(--acc);font-family:var(--mono);font-size:var(--fs-12);line-height:1.6;min-height:20px;margin-right:auto}
.settings-message.error{color:#d98a7a}
.settings-inline-actions{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-top:14px}
.settings-inline-actions .btn{min-height:38px;flex:none}
.settings-inline-actions .settings-note{flex:1 1 100%;min-width:0;word-break:break-word;line-height:1.6}
.settings-note.ok{color:#8fce9b}
.settings-note.error{color:#d98a7a}
@media(max-width:650px){.header-tools{gap:10px}.header-tools nav{gap:12px}.settings-backdrop{padding:10px}.settings-dialog{max-height:94vh}.settings-head{padding:18px 18px 14px}.settings-body{padding:14px 18px 4px}.settings-actions{padding:16px 18px}.settings-grid{grid-template-columns:1fr}.settings-field.wide{grid-column:auto}}
/* toast */

footer{border-top:1px solid var(--line);padding:34px 0 46px;margin-top:30px;flex:none}

input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,input:-webkit-autofill:active{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 1000px var(--panel) inset;box-shadow:0 0 0 1000px var(--panel) inset;caret-color:var(--ink);transition:background-color 600000s 0s,color 600000s 0s}

.ft{display:flex;justify-content:space-between;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.2em;color:var(--faint);text-transform:uppercase;line-height:2.2;flex-wrap:wrap;gap:10px}
.proto-note{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.24em;color:var(--faint);text-transform:uppercase;border:1px dashed var(--line2);display:inline-block;padding:5px 12px;margin-bottom:18px}
.big-sec-title{font-family:var(--serif);font-weight:500;font-size:var(--fs-40);margin:14px 0 8px}

@media (max-width:1000px){.trow{grid-template-columns:44px 70px 1fr;gap:16px}.trow>*{padding:16px 0}.trow .info{padding:16px 0}.trow .info::after,.trow .ol::after{display:none}.trow .ol,.trow .plcol{display:none}.collage{display:none}.dgrid{grid-template-columns:1fr}.islands,.cards3,.outgrid{grid-template-columns:1fr}.chain{grid-template-columns:1fr}.axis-duo{grid-template-columns:1fr}}

<body>
<div id="app"></div>
<div id="settings-root"></div>
<div id="account-root"></div>
<div id="auth-root"></div>
<div id="toast"></div>
<script>
/* ================= DATA (loaded from /api/atlas) ================= */
let ISSUE={};
let AXES=[];
let INTERESTS=[];
let RECS=[];
let ARTISTS={};
let ALBUMS={};
let SOURCES=[];
let WORKFLOW={analysis_executor_configured:false,recommendation_executor_configured:false,analysis_parallelism:5,recommendation_parallelism:4,track_percentile_options:[0.25,0.5,1],track_percentile_default:1,await_limit_timeout_seconds:1800};
let ACTIVE_JOB_ID=null;
let LATEST_JOB_ID=null;
const WORKFLOW_LAST_JOB_KEY="music-atlas.workflow.last-job.v1";
function storedWorkflowJobId(){try{return localStorage.getItem(WORKFLOW_LAST_JOB_KEY)||null;}catch{return null;}}
function rememberWorkflowJobId(id){if(!id)return;LATEST_JOB_ID=String(id);try{localStorage.setItem(WORKFLOW_LAST_JOB_KEY,LATEST_JOB_ID);}catch{}}
let workflowCancelledJobId=null;
let workflowPollTimer=null;
let workflowEventSource=null;
let workflowStreamId=null;
let workflowClockTimer=null;
let workflowFinishedJobId=null;
let SETTINGS=null;
let SECRET_STATUS=null;
let CURRENT_USER=null;
let AUTH_REQUIRED=false;
let SAVED_PLAYLISTS=[];
let USER_PREFERENCES={};

/* 任务活跃状态：awaiting_limit 表示歌单已读取、正在等用户选择处理数量，不能当终态。 */
const WORKFLOW_ACTIVE_STATUSES=["queued","running","awaiting_limit"];
const workflowActive=status=>WORKFLOW_ACTIVE_STATUSES.includes(status);
/* ================= HELPERS ================= */
const hueFor=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h;};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
 const byId=id=>RECS.find(r=>r.id===decodeURIComponent(id||""));
const intBy=raw=>{const key=decodeURIComponent(String(raw||""));const direct=INTERESTS.find(i=>i.id===key)||INTERESTS.find(i=>interestSlug(i)===key);if(direct)return direct;const legacy=key.match(/^(?:agent-|智能助手-)?island-(\d+)$/i);if(legacy)return INTERESTS.find(i=>Number(i.code)===Number(legacy[1]));return undefined;};
const interestSlug=i=>"island-"+String(Number(i&&i.code)||1);
const interestHref=v=>{const item=typeof v==="string"?INTERESTS.find(i=>i.id===v):v;return "#/interest/"+(item?interestSlug(item):encodeURIComponent(String(v||"")));};
const repLines=i=>{const records=Array.isArray(i&&i.sourceRecords)?i.sourceRecords:[];const artists=new Set();for(const r of records){const [title,artist]=String(r.track_key||"").split("\u001f");if(artist)artists.add(artist.trim());}return ((i&&i.repTracks)||[]).map(raw=>{const text=String(raw||"").trim();const parts=text.split(/\s+[—-]\s+/);if(parts.length<2)return text;const [a,b]=parts;if(artists.has(a)&&!artists.has(b))return b+" - "+a;if(artists.has(b)&&!artists.has(a))return a+" - "+b;return b+" - "+a;});};
const repGroups=i=>{const lines=repLines(i).map(line=>{const parts=String(line||"").split(/\s+-\s+/);return {title:parts[0]||line,artist:parts[1]||""};});return (i.artists||[]).slice(0,10).map(artist=>({artist,items:lines.filter(item=>item.artist===artist).sort((left,right)=>String(left.title).localeCompare(String(right.title),"en",{sensitivity:"base"})).slice(0,5)}));};
const metaKey=(artist,track)=>artist+"|"+track;
const metaCache={}; // artist|track → Promise
function fetchMeta(artist,track){const k=metaKey(artist,track);if(!metaCache[k])metaCache[k]=fetch(`/api/meta?artist=${encodeURIComponent(artist)}&track=${encodeURIComponent(track)}`).then(r=>r.json()).catch(()=>({ok:false}));return metaCache[k];}
/* 渲染后扫描封面占位与链接锚点，异步填充真实封面 / 三平台歌曲链接 */
function hydrate(rootEl){
 // data-cover 是后端实际核验过的公开封面；加载失败时再调用 /api/meta 获取备用来源。
 const covers=rootEl.querySelectorAll(".cover[data-cover],.cover[data-artist]");
 const links=rootEl.querySelectorAll("a[data-songlink]");
 let pending=covers.length;
 const reveal=()=>{document.body.classList.add("covers-ready");};
 const attach=(el,src,done)=>{
  if(!src){done();return;}
  const img=document.createElement("img");img.className="cover-img";img.alt="";img.referrerPolicy="no-referrer";img.src=src;
  let settled=false;
  const finish=()=>{if(settled)return;settled=true;done();};
  img.onload=()=>{el.classList.add("has-img");finish();};
  img.onerror=()=>{img.remove();finish();};
  el.appendChild(img);
 };
 if(pending===0)reveal();
 covers.forEach(el=>{
  if(el.dataset.done){if(--pending===0)reveal();return;}
  el.dataset.done="1";
  let finished=false;
  const finish=()=>{if(finished)return;finished=true;if(--pending===0)reveal();};
  const fallback=()=>fetchMeta(el.dataset.artist,el.dataset.track).then(m=>{
   const primary=el.dataset.cover||"";
   if(m&&m.ok&&m.cover&&m.cover!==primary){attach(el,m.cover,finish);}
   else finish();
  }).catch(finish);
  if(el.dataset.cover){
   const img=document.createElement("img");img.className="cover-img";img.alt="";img.referrerPolicy="no-referrer";img.src=el.dataset.cover;
   let loaded=false;
   img.onload=()=>{loaded=true;el.classList.add("has-img");finish();};
   img.onerror=()=>{img.remove();if(!loaded&&el.dataset.artist&&el.dataset.track)fallback();else finish();};
   el.appendChild(img);
  }else if(el.dataset.artist&&el.dataset.track){fallback();}else finish();
 });
 links.forEach(a=>{
  if(a.dataset.done)return;a.dataset.done="1";
  const [artist,track,plat]=a.dataset.songlink.split("||");
  fetchMeta(artist,track).then(m=>{
   const url=m&&m.ok&&m.links?m.links[plat]:null;
   if(url){a.href=url;a.classList.remove("wait");}
   else{a.classList.remove("wait");a.classList.add("nodata");a.title="未能解析到具体歌曲，请到平台搜索";}
  });
 });
}

const cover=(hue,label,o)=>{o=o||{};const data=(o.cover?` data-cover="${esc(o.cover)}"`:"")+(o.artist&&o.track?` data-artist="${esc(o.artist)}" data-track="${esc(o.track)}"`:"");return `<div class="cover ${o.cls||""}" style="${o.style||""}--cover-fallback:linear-gradient(140deg,hsl(${hue} 42% 26%),hsl(${(hue+50)%360} 55% 11%))"${data}>${o.mini?"":'<div class="frame"></div>'}<span class="ci"${o.ci?` style="${o.ci}"`:""}>${esc(label)}</span></div>`;};
const repKey=i=>{const p=(i.repTracks[0]||"").split(" — ");return {artist:p[0]||"",track:p[1]||""};};
const tcls=t=>t==="style"?"t-style":t==="ext"?"t-ext":t==="rel"?"t-rel":"t-exp";
const typeChip=r=>`<span class="typechip ${tcls(r.type)}">${r.typeLabel}</span>`;
const badgeCls=s=>({confirmed:"b-confirmed",pending:"b-pending","has-source":"b-has-source",speculative:"b-speculative",computed:"b-computed"}[s]||"b-computed");
const badgeTxt=s=>({confirmed:"已确认",pending:"待二次验证","has-source":"有来源支持",speculative:"推测性关系",computed:"程序计算",ready:"已生成",accepted:"已通过",rejected:"未通过",unknown:"未知"}[s]||statusText(s));
const PLAT=[
 ["apple","在 Apple Music 打开"],
 ["netease","网易云音乐"],
 ["qq","QQ 音乐"]];
const openBtns=r=>PLAT.map(([k,l])=>`<a class="plink wait" data-songlink="${esc(r.artist)}||${esc(r.track)}||${k}" href="#" target="_blank" rel="noopener">${l} ↗</a>`).join("");
const openRow=r=>`<div class="plcol">${openBtns(r)}</div>`;
let toastT;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2600);}
function radar(a,color,size){size=size||190;const c=size/2,R=c-26;const pt=(i,v)=>{const ang=Math.PI*2*i/8-Math.PI/2;const r=R*v/100;return[c+Math.cos(ang)*r,c+Math.sin(ang)*r].map(n=>n.toFixed(1)).join(",");};
 let grid="";[.25,.5,.75,1].forEach(g=>{grid+=`<polygon points="${AXES.map((_,i)=>pt(i,g*100)).join(" ")}" fill="none" stroke="#2b251d" stroke-width="1"/>`;});
 const labels=AXES.map((ax,i)=>{const ang=Math.PI*2*i/8-Math.PI/2;const x=c+Math.cos(ang)*(R+14),y=c+Math.sin(ang)*(R+14);return`<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" font-size="12" font-family="Cormorant Garamond,思源宋体 CN,serif" fill="#6e6759">${ax[0]}</text>`;}).join("");
 const value=(key)=>{const v=a&&a[key];return typeof v==="number"&&Number.isFinite(v)?v:null;};
 const poly=`<polygon points="${AXES.map((ax,i)=>pt(i,value(ax[0])===null?0:value(ax[0]))).join(" ")}" fill="${color}" fill-opacity=".16" stroke="${color}" stroke-width="1.5"/>`;
 const dots=AXES.map((ax,i)=>{const p=pt(i,value(ax[0])===null?0:value(ax[0])).split(",");return`<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="${color}"/>`;}).join("");
 return`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${grid}${poly}${dots}${labels}</svg>`;}
 const axisBars=a=>AXES.map(([k,n])=>{const v=a&&typeof a[k]==="number"?a[k]:null;return`<div class="axbar"><span class="an">${n.split(" · ")[0]}</span><div class="tr"><div class="fl" style="width:${v===null?0:v}%"></div></div><span class="av">${v===null?"—":v}</span></div>`;}).join("");
const routeHTML=route=>route.map((s,i)=>{const [k,l,t]=s;const sym={int:"◈",style:"◇",move:"↓",rel:"◉",artist:"▲",track:"●"}[k]||"·";const tZH={int:"你的版图",style:"风格族群",move:"移动",rel:"音乐人关系",artist:"候选艺人",track:"结果"}[k]||t;
 return`<div class="rstep"><div class="rk">${sym}</div><div class="rv"><div class="l2">${tZH}</div><div class="l1">${esc(l)}</div></div></div>`+(i<route.length-1?`<div class="rline">│</div>`:"");}).join("");
const tasteHTML=t=>`<div class="tconn">${t.map((v,i)=>{const last=i===t.length-1;return`<div class="tnode ${last?"cur":""}"><div class="tk">${["起点","代表曲目","连接","推荐结果"][i]||""}</div><div class="tv">${esc(v)}</div></div>`+(last?"":`<div class="tarrow">→</div>`);}).join("")}</div>`;
const detailHTML=d=>Object.entries({preference_basis:"偏好底色",music_fit:"风格连接",novelty:"探索价值",listening_tip:"聆听建议"}).map(([key,label])=>d&&d[key]?`<div class="detail-note"><h4 class="kicker" style="margin:18px 0 8px">${label}</h4><p class="explain">${esc(d[key])}</p></div>`:"").join("");
 const evHTML=evs=>`<div class="evgrid">${evs.map(e=>`<div class="evcard"><div class="ek">${e.kind} · ${esc(e.provider)}</div><div class="ed">${esc(e.detail)}</div><div class="evmeta">${e.retrieved&&e.retrieved!=="—"?`<span>获取于 ${esc(e.retrieved)}</span>`:""}<span>等级 ${esc(e.grade)}</span><span class="badge ${badgeCls(e.status)}">${badgeTxt(e.status)}</span></div>${/^https:\/\//.test(e.url||"")?`<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:12px">查看资料 ↗</a>`:""}</div>`).join("")}</div>`;

 let ATLAS=null;
 let ATLAS_GROUP_INDEX=0;
 let SOURCE_PAGE_SIZE=10;
 let SOURCE_PAGE_INDEX=1;
 let myHistoryItems=[];
 let TASTE=null;
 const statusText=s=>{const t={complete:"已完成",completed:"已完成",confirmed:"已确认",running:"运行中",queued:"排队中",failed:"失败",degraded:"覆盖不足",ready:"已生成",draft:"",pending:"待处理",pending_verification:"待独立核验",completed_with_gaps:"已完成（有资料缺口）",accepted:"已通过",rejected:"未通过",unconfirmed:"待确认",incomplete:"不完整",not_available:"不可用",unknown:"未知",insufficient_evidence:"证据不足",offline:"本地核验",analysis:"程序分析",recommendation:"推荐生成",research:"公开资料研究",lastfm:"音乐资料",lastfm_agent:"公开资料",public_facts_only:"公开资料",csv:"歌单文件",netease_public:"网易云公开歌单",qq_public:"QQ 音乐公开歌单",apple_music:"Apple Music 歌单",playlistsnapshot:"歌单快照",ready_for_export:"已准备发布"}[String(s||"").toLowerCase()];return t===undefined?(s||"未知"):t;};
 function statusBanner(){
  if(!ATLAS||!ATLAS.status||guestMode())return"";
  const s=ATLAS.status;const notes=[];
  if(s.review==="completed_with_gaps")notes.push("复核已完成，部分资料缺口留空");
  if(s.review==="rejected")notes.push("复核未通过");
  if(s.evidence_audit==="pending_verification")notes.push("公开事实待独立核验");
  if(s.profile_coverage_degraded)notes.push("画像覆盖不足");
  if(s.recommendation==="insufficient_evidence")notes.push("证据不足，暂无正式推荐");
  if(!notes.length)return"";
  return`<div class="atlas-status"><div class="wrap">状态：${notes.map(esc).join(" · ")}</div></div>`;
 }
 function sourceInterestIslands(records){
  const groups=new Map();
  for(const record of records){
   const tags=(record.tags||[]).map(t=>t.tag).filter(Boolean);
   const name=tags[0]||"待补充资料",key=name.trim().toLocaleLowerCase();
   if(!groups.has(key))groups.set(key,{name,records:[]});
   groups.get(key).records.push(record);
  }
  return [...groups.entries()].sort((a,b)=>b[1].records.length-a[1].records.length||a[0].localeCompare(b[0])).map(([key,g],index)=>{
   const tracks=g.records.map(r=>{const [title,artist]=(r.track_key||"").split("\u001f");return {title:title||"未知曲目",artist:artist||"未知艺人"};});
   return {id:"lastfm-"+key,code:String(index+1).padStart(2,"0"),name:g.name,genres:[g.name],summary:`${g.records.length} 首曲目`,hue:(25+index*37)%360,axes:null,artists:[...new Set(tracks.map(t=>t.artist))],repTracks:tracks.map(t=>t.artist+" — "+t.title),sourceRecords:g.records};
  });
 }
 function islandSources(i){if(!i.sourceRecords)return "";return `<details class="island-sources" data-source-island="${esc(i.id)}">${islandSourcesInner(i)}</details>`;}
function islandSourcesInner(i){
 const records=i.sourceRecords||[];const total=records.length;
 const size=SOURCE_PAGE_SIZE===5?5:10;
 const pages=Math.max(1,Math.ceil(total/size));
 const page=Math.min(Math.max(SOURCE_PAGE_INDEX,1),pages);
 const scopeLabels={track:"单曲标签",album:"专辑标签",artist:"艺人标签"};
 const rows=records.slice((page-1)*size,page*size).map((r,index)=>{
  const title=r.title||(r.track_key||"").split("\u001f")[0]||"";
  const artist=r.artist||(r.track_key||"").split("\u001f")[1]||"";
  const tags=Array.isArray(r.tags)?r.tags:[];

async function resetSettings(){
 if(!window.confirm("删除网页设置覆盖并恢复项目默认配置？"))return;
 try{const response=await fetch("/api/settings",{method:"DELETE"});const payload=await response.json();if(!response.ok||!payload.ok)throw new Error(payload.error||"恢复默认失败");SETTINGS=payload.settings;const configResponse=await fetch("/api/config",{cache:"no-store"});if(configResponse.ok){const config=await configResponse.json();if(config.ok)applyWorkflowConfig(config);}renderSettingsModal("已恢复项目默认配置");toast("已恢复默认设置");}catch(error){settingsMessage(error.message||"恢复默认失败",true);}
}

/* ================= ROUTER ================= */
function render(keepScroll=false){const scrollY=keepScroll?window.scrollY:0;const guest=guestMode(),h=guest?"/discover":(location.hash.replace(/^#/,"")||"/discover");let html=header();
 const m=h.split("/").filter(Boolean);
 const map={"/discover":vDiscover,"/atlas":()=>vAtlas(m[1]),"/taste":vTaste,"/sources":vSources,
  "/why":()=>vWhy(m[1]),"/track":()=>vTrack(m[1]),"/album":()=>vAlbum(m[1]),"/artist":()=>vArtist(m[1]),"/interest":()=>vInterest(m[1])};
 const view=guest?vGuest():(map["/"+(m[0]||"discover")]||(()=>v404()))();
 html+=`<main class="page">${view}</main>`+footer();
 document.body.classList.remove("covers-ready");
 document.getElementById("app").innerHTML=html;window.scrollTo(0,scrollY);
  hydrate(document.getElementById("app"));
  bindWorkflowControls();}
/* global click delegation */
document.addEventListener("click",async e=>{
 const authOpen=e.target.closest("[data-auth-open]");
 if(authOpen){e.preventDefault();authModal(authOpen.dataset.authOpenMode||"login");return;}
 const myPrune=event.target.closest("[data-my-history-prune]");
 if(myPrune){const item=myHistoryItems[Number(myPrune.dataset.myHistoryPrune)];if(item){try{const response=await fetch(`/api/me/recommendation-history/${encodeURIComponent(item.file)}/prune`,{method:"POST"});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||"清理失败");toast(`已清理 ${result.removed} 条过期记录`);await loadAccountHistory();}catch(error){toast(error.message);}}return;}
 const myClear=event.target.closest("[data-my-history-clear]");
 if(myClear){const item=myHistoryItems[Number(myClear.dataset.myHistoryClear)];if(item){if(!window.confirm("确认清除该歌单的全部去重记录？相关曲目可能被再次推荐。"))return;try{const response=await fetch(`/api/me/recommendation-history/${encodeURIComponent(item.file)}`,{method:"DELETE"});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||"清除失败");toast("已清除");await loadAccountHistory();}catch(error){toast(error.message);}}return;}
 const myEntry=event.target.closest("[data-my-history-entry]");
 if(myEntry){const item=myHistoryItems[Number(myEntry.dataset.myHistoryEntry)];const stamp=myEntry.dataset.myHistoryStamp;if(item&&stamp){if(!window.confirm("确认放回该次推荐产生的去重条目？"))return;try{const response=await fetch(`/api/me/recommendation-history/${encodeURIComponent(item.file)}/entries/${encodeURIComponent(stamp)}`,{method:"DELETE"});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||"清除失败");toast("已清除该次记录");await loadAccountHistory();}catch(error){toast(error.message);}}return;}
 const accountOpen=e.target.closest("[data-account-open]");
 if(accountOpen){e.preventDefault();openAccount();return;}
 const tagsToggle=e.target.closest("[data-source-tags-toggle]");
 if(tagsToggle){const wrap=tagsToggle.closest(".source-tags");if(wrap){const hidden=wrap.querySelectorAll(".source-tag.rest");const expanded=tagsToggle.dataset.expanded==="1";hidden.forEach(node=>{node.hidden=expanded;});tagsToggle.dataset.expanded=expanded?"0":"1";tagsToggle.textContent=expanded?"+"+hidden.length:"收起";}return;}
 const sourceSize=e.target.closest("[data-source-size]");
 if(sourceSize){const details=sourceSize.closest("details[data-source-island]");const item=details&&intBy(details.dataset.sourceIsland);if(item){SOURCE_PAGE_SIZE=Number(sourceSize.dataset.sourceSize)===5?5:10;SOURCE_PAGE_INDEX=1;details.innerHTML=islandSourcesInner(item);}return;}
 const sourcePage=e.target.closest("[data-source-page]");
 if(sourcePage){const details=sourcePage.closest("details[data-source-island]");const item=details&&intBy(details.dataset.sourceIsland);if(item){SOURCE_PAGE_INDEX=Number(sourcePage.dataset.sourcePage)||1;details.innerHTML=islandSourcesInner(item);}return;}
 const accountTab=e.target.closest("[data-account-tab]");
 if(accountTab){e.preventDefault();const name=accountTab.dataset.accountTab;document.querySelectorAll("[data-account-tab]").forEach(node=>node.classList.toggle("on",node===accountTab));const body=document.querySelector("[data-account-body]");if(body)body.innerHTML=accountTabContent(name);if(name==="history")loadAccountRuns();if(name==="cache")loadAccountHistory();return;}
 const accountClose=e.target.closest("[data-account-close]");
 if(accountClose&&(accountClose===e.target||accountClose.classList.contains("settings-close"))){e.preventDefault();closeAccount();return;}
 const authClose=e.target.closest("[data-auth-close]");
 if(authClose&&(authClose===e.target||authClose.classList.contains("auth-close"))){e.preventDefault();closeAuth();return;}
 const authMode=e.target.closest("[data-auth-mode]");
 if(authMode){e.preventDefault();authModal(authMode.dataset.authMode||"login");return;}
 const authLogout=e.target.closest("[data-auth-logout]");
 if(authLogout){e.preventDefault();try{await fetch("/api/auth/logout",{method:"POST"});}catch{}CURRENT_USER=null;render();toast("已退出登录");return;}
 const open=e.target.closest("[data-settings-open]");
 if(open){e.preventDefault();openSettings();return;}
 const close=e.target.closest("[data-settings-close]");
 if(close&&(close===e.target||close.classList.contains("settings-close"))){e.preventDefault();closeSettings();return;}
 const reset=e.target.closest("[data-settings-reset]");
 if(reset){e.preventDefault();resetSettings();return;}
 const clearKey=e.target.closest("[data-settings-clear-key]");
 if(clearKey){e.preventDefault();clearApiKey();return;}
 const testAi=e.target.closest("[data-settings-test-ai]");
 if(testAi){e.preventDefault();testAiConnection();return;}
 const stageSummary=e.target.closest("[data-wf-stage-panel] > summary");
 if(stageSummary){const panel=stageSummary.parentElement;if(panel)panel.dataset.userToggled="1";return;}
 const resumeJob=e.target.closest("[data-wf-resume]");
 if(resumeJob){e.preventDefault();const id=resumeJob.dataset.wfResume;if(!id)return;resumeJob.disabled=true;
  try{
   const response=await fetch(`/api/jobs/${encodeURIComponent(id)}/retry`,{method:"POST"});
   const payload=await response.json();
   if(!response.ok||!payload.ok)throw new Error(payload.error||"无法续跑任务");
   ACTIVE_JOB_ID=payload.job.id;rememberWorkflowJobId(payload.job.id);workflowFinishedJobId=null;
   renderWorkflowJob(payload.job);pollWorkflowJob(ACTIVE_JOB_ID);
   toast("已续跑：跳过已完成的步骤");
  }catch(error){resumeJob.disabled=false;toast(error.message||"无法续跑任务");}
  return;}
 const logToggle=e.target.closest("[data-wf-log-toggle]");
 if(logToggle){e.preventDefault();const flow=logToggle.closest("#flow"),panel=flow&&flow.querySelector("[data-wf-log-panel]");if(panel){const open=panel.classList.toggle("hidden")===false;logToggle.setAttribute("aria-expanded",open?"true":"false");logToggle.textContent=open?"收起运行日志":"查看运行日志";}return;}
 const logCopy=e.target.closest("[data-wf-log-copy]");
 if(logCopy){e.preventDefault();const text=logCopy.closest("#flow")?.querySelector("[data-wf-log-text]")?.textContent||"";try{await navigator.clipboard.writeText(text);toast("运行日志已复制");}catch{const area=document.createElement("textarea");area.value=text;document.body.appendChild(area);area.select();document.execCommand("copy");area.remove();toast("运行日志已复制");}return;}
 const sl=e.target.closest("[data-songlink]");
 if(sl){e.stopPropagation();
  if(!sl.href||sl.href.endsWith("#")||sl.classList.contains("wait")){e.preventDefault();toast("正在解析歌曲链接，请稍候…");}
  else if(sl.classList.contains("nodata")){e.preventDefault();toast("未能解析到具体歌曲，请到平台内搜索："+sl.textContent.replace(" ↗",""));}
  return;}
 const prev=e.target.closest("[data-atlas-prev]");
 if(prev){e.preventDefault();const groups=atlasGroups();if(ATLAS_GROUP_INDEX>0){applyAtlasGroup(ATLAS_GROUP_INDEX-1);render(true);toast(`已返回第 ${ATLAS_GROUP_INDEX+1}/${groups.length} 组 Atlas`);}return;}
 const swap=e.target.closest("[data-atlas-swap]");
 if(swap){e.preventDefault();const groups=atlasGroups();if(ATLAS_GROUP_INDEX<groups.length-1){applyAtlasGroup(ATLAS_GROUP_INDEX+1);render(true);toast(`已换到第 ${ATLAS_GROUP_INDEX+1}/${groups.length} 组 Atlas`);}return;}
 const newAtlas=e.target.closest("[data-atlas-new]");
 if(newAtlas){e.preventDefault();if(ACTIVE_JOB_ID){toast("已有工作流正在运行");return;}newAtlas.disabled=true;try{const response=await fetch("/api/atlas/new",{method:"POST",headers:{"Content-Type":"application/json"}});const payload=await responseJson(response,"无法生成新 Atlas");if(!response.ok||!payload.ok)throw new Error(payload.error||"无法生成新 Atlas");ACTIVE_JOB_ID=payload.job.id;rememberWorkflowJobId(payload.job.id);workflowFinishedJobId=null;setWorkflowButtonBusy(true);renderWorkflowJob(payload.job);pollWorkflowJob(ACTIVE_JOB_ID);toast("已启动新 Atlas：沿用已有分析重新生成推荐");}catch(error){newAtlas.disabled=false;toast(error.message||"无法生成新 Atlas");}return;}
 const tab=e.target.closest("[data-tab]");
 if(tab){const f=tab.getAttribute("data-tab");location.hash="#/atlas/"+(f==="all"?"":f);if(f==="all"){render();}return;}
 const go=e.target.closest("[data-go]");
 if(go){if(!e.target.closest("[data-open]")){location.hash=go.getAttribute("data-go");}return;}});
document.addEventListener("submit",event=>{const form=event.target.closest("[data-auth-form]");if(form){event.preventDefault();submitAuth(form);return;}const profileForm=event.target.closest("[data-account-profile]");if(profileForm){event.preventDefault();submitAccountProfile(profileForm);return;}const passwordForm=event.target.closest("[data-account-password]");if(passwordForm){event.preventDefault();submitAccountPassword(passwordForm);}});
window.addEventListener("hashchange",()=>{render();});
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&document.getElementById("settings-root")?.firstElementChild)closeSettings();});
bootAtlas();
</script>
