<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Atlas · 管理后台</title>
<link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico">
<link rel="preload" href="/fonts/EBGaramond.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/fonts/EBGaramond-Italic.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:"MA Latin";src:url("/fonts/EBGaramond.ttf") format("truetype-variations");font-weight:400 800;font-style:normal;font-display:block}
@font-face{font-family:"MA Latin";src:url("/fonts/EBGaramond-Italic.ttf") format("truetype-variations");font-weight:400 800;font-style:italic;font-display:block}
@font-face{font-family:"MA CJK";src:local("思源宋体 CN"),local("Source Han Serif CN"),local("Noto Serif SC"),local("SimSun");font-weight:400;font-style:normal}
:root{--bg:#0f0d0a;--bg2:#15120e;--panel:#1a1611;--ink:#eae3d6;--dim:#a39a88;--faint:#6e6759;--line:#2b251d;--line2:#3a3226;--acc:#c8622f;--gold:#c9a227;--serif:"MA Latin","MA CJK",serif;--mono:"MA Latin","MA CJK",serif}
*{box-sizing:border-box;margin:0;padding:0}html{scrollbar-gutter:stable}body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:16px;line-height:1.6;font-variant-numeric:lining-nums;font-size-adjust:.5;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}::selection{background:var(--acc);color:#fff}.wrap{max-width:1180px;margin:0 auto;padding:0 40px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,13,10,.94);backdrop-filter:blur(8px);z-index:10}.hd{height:60px;display:flex;align-items:center;justify-content:space-between}.logo{font-family:var(--serif);font-size:20px;letter-spacing:.12em}.logo em{color:var(--acc);font-style:normal}.nav{display:flex;align-items:center;gap:24px;font-size:12px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}.nav a:hover{color:var(--ink)}
main{padding:48px 0 80px}.kicker{font-size:12px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}.kicker b{color:var(--acc);font-weight:400}.hero-title{font-family:var(--serif);font-weight:500;font-size:54px;line-height:1.05;margin:18px 0 10px}.lede{max-width:620px;color:var(--dim);font-size:17px;line-height:1.8}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;margin-top:38px}.panel{border:1px solid var(--line);background:var(--bg2);padding:25px}.panel h2{font-family:var(--serif);font-weight:500;font-size:28px;margin-bottom:4px}.panel-note{color:var(--dim);font-size:13px;line-height:1.7;margin-bottom:18px}.login-wrap{min-height:62vh;display:grid;place-items:center}.login-panel{width:min(440px,100%);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:11px;letter-spacing:.14em;color:var(--faint)}.field input,.field textarea,.field select{width:100%;font:inherit;font-family:var(--mono);font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line2);padding:10px 12px;outline:none}.field textarea{min-height:170px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--acc)}.btn{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:10px 16px;border:1px solid var(--line2);color:var(--dim);cursor:pointer;background:none}.btn:hover{color:var(--ink);border-color:var(--acc)}.btn.primary{border-color:var(--acc);color:var(--acc)}.btn.primary:hover{background:var(--acc);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}.message{font-size:13px;color:var(--dim);min-height:22px;line-height:1.6}.message.error{color:#d98a7a}.message.ok{color:#8fce9b}.status{display:inline-block;font-size:11px;letter-spacing:.12em;padding:2px 8px;border:1px solid #2f4a35;color:#8fce9b}.status.off{border-color:#572d24;color:#d98a7a}.user-table{width:100%;border-collapse:collapse;font-size:13px}.user-table th,.user-table td{text-align:left;vertical-align:middle;border-top:1px solid var(--line);padding:11px 8px}.user-table th{font-size:11px;letter-spacing:.12em;color:var(--faint);font-weight:400}.user-actions{display:flex;gap:7px;flex-wrap:wrap}.user-actions .btn{font-size:10px;padding:5px 8px;letter-spacing:.1em}.code-note{font-family:var(--mono);font-size:12px;color:var(--faint);line-height:1.7;word-break:break-word}.split{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.rule{border-top:1px solid var(--line);margin:22px 0}.secret-state{font-size:13px;color:var(--dim);padding:9px 0}.danger{color:#d98a7a}.loading{min-height:40vh;display:grid;place-items:center;color:var(--dim);font-size:14px;letter-spacing:.08em}footer{border-top:1px solid var(--line);padding:30px 0 44px;color:var(--faint);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
@media(max-width:850px){.wrap{padding:0 22px}.grid{grid-template-columns:1fr}.hero-title{font-size:44px}.user-table{display:block;overflow:auto;white-space:nowrap}}
</style>
</head>
<body>
<header><div class="wrap hd"><a class="logo" href="/">MUSIC <em>ATLAS</em></a><div class="nav"><span>管理后台</span><a href="/">返回主页 ↗</a></div></div></header>
<main class="wrap" id="app"><div class="loading">正在读取后台状态…</div></main>
<footer><div class="wrap">MUSIC ATLAS · 管理后台</div></footer>
<script>
"use strict";
const app=document.getElementById("app");
const esc=value=>String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");
let admin=null,users=[],settings=null,secret=null;
const jsonHeaders={"Content-Type":"application/json"};
async function api(url,options={}){const response=await fetch(url,{cache:"no-store",...options});let payload=null;try{payload=await response.json();}catch{}if(!response.ok||!payload?.ok)throw new Error(payload?.error||`请求失败（${response.status}）`);return payload;}
function message(text="",error=false){const node=document.querySelector("[data-message]");if(node){node.textContent=text;node.className=`message ${error?"error":text?"ok":""}`;}}
function renderLogin(error=""){app.innerHTML=`<div class="login-wrap"><section class="panel login-panel"><div class="kicker"><b>01</b> · 管理区域</div><h1 class="hero-title" style="font-size:42px">管理员登录</h1><p class="panel-note">此入口只接受管理员会话。普通用户不会看到系统配置、密钥或用户管理数据。</p><form data-login><div class="field"><label for="admin-user">用户名</label><input id="admin-user" name="username" autocomplete="username" required></div><div class="field"><label for="admin-pass">密码</label><input id="admin-pass" name="password" type="password" autocomplete="current-password" required></div><div class="message ${error?"error":""}" data-message>${esc(error)}</div><div class="actions"><button class="btn primary" type="submit">进入后台</button></div></form></section></div>`;document.getElementById("admin-user")?.focus();}
function renderDashboard(){app.innerHTML=`<div class="kicker"><b>后台</b> · MUSIC ATLAS</div><h1 class="hero-title">后台控制台</h1><p class="lede">管理员 ${esc(admin.username)} · 配置修改只影响下一次工作流，密钥值不会回显。</p><div class="grid"><section class="panel"><div class="split"><div><h2>用户管理</h2><p class="panel-note">控制账号状态与权限。停用账号会立即撤销其后台会话。</p></div><span class="status">已认证</span></div><div id="users"><div class="loading">正在读取用户…</div></div></section><section class="panel"><h2>系统设置</h2><p class="panel-note">完整配置仅在管理员后台可见。保存后从下一次任务开始生效。</p><form data-settings><div class="field"><label for="settings-json">配置 JSON</label><textarea id="settings-json" spellcheck="false"></textarea></div><div class="message" data-settings-message></div><div class="actions"><button class="btn primary" type="submit">保存设置</button><button class="btn" type="button" data-reset-settings>恢复默认覆盖</button></div></form><div class="rule"></div><h2 style="font-size:24px">AI 密钥</h2><div class="secret-state" data-secret-state>正在读取密钥状态…</div><form data-secret><div class="field"><label for="api-key">新 API Key（留空不修改）</label><input id="api-key" name="api_key" type="password" autocomplete="new-password"></div><div class="message" data-secret-message></div><div class="actions"><button class="btn primary" type="submit">保存密钥</button><button class="btn" type="button" data-test-ai>测试连接</button><button class="btn" type="button" data-clear-secret>清除密钥</button></div></form></section></div>`;renderUsers();renderSettings();renderSecret();}
function renderUsers(){const root=document.getElementById("users");if(!root)return;if(!users.length){root.innerHTML='<div class="code-note">暂无注册用户。</div>';return;}root.innerHTML=`<table class="user-table"><thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>最近登录</th><th>操作</th></tr></thead><tbody>${users.map(user=>`<tr><td>${esc(user.username)}</td><td>${user.role==="admin"?"管理员":"用户"}</td><td><span class="status ${user.status!=="enabled"?"off":""}">${user.status==="enabled"?"启用":"停用"}</span></td><td>${esc(user.last_login_at||"—")}</td><td><div class="user-actions"><button class="btn" data-user-status="${user.id}" data-status="${user.status==="enabled"?"disabled":"enabled"}">${user.status==="enabled"?"停用":"启用"}</button>${user.id!==admin.id?`<button class="btn" data-user-role="${user.id}" data-role="${user.role==="admin"?"user":"admin"}">${user.role==="admin"?"撤销管理员":"设为管理员"}</button>`:""}</div></td></tr>`).join("")}</tbody></table>`;}
function renderSettings(){const area=document.getElementById("settings-json");if(area)area.value=JSON.stringify(settings?.settings||{},null,2);}
function renderSecret(){const node=document.querySelector("[data-secret-state]");if(!node)return;if(secret?.configured){node.textContent="已配置 · 存储位置："+(secret.backend||"系统密钥库")+(secret.writable===false?" · 当前只读":"")+(secret.warning?" · "+secret.warning:"");}else{node.textContent="尚未配置 API Key"+(secret?.warning?" · "+secret.warning:"");}}
async function loadDashboard(){try{const [u,s,k]=await Promise.all([api("/api/admin/users"),api("/api/admin/settings"),api("/api/admin/secrets")]);users=u.users||[];settings=s;secret=k;renderDashboard();}catch(error){app.innerHTML=`<div class="login-wrap"><section class="panel login-panel"><h2>后台读取失败</h2><p class="panel-note">${esc(error.message)}</p><button class="btn" data-reload>重新读取</button></section></div>`;}}
async function boot(){try{const payload=await api("/api/admin/me");admin=payload.user;}catch{}if(admin)await loadDashboard();else renderLogin();}
document.addEventListener("submit",async event=>{const login=event.target.closest("[data-login]");if(login){event.preventDefault();const button=login.querySelector("button[type=submit]");if(button)button.disabled=true;try{const payload=await api("/api/admin/login",{method:"POST",headers:jsonHeaders,body:JSON.stringify(Object.fromEntries(new FormData(login).entries()))});admin=payload.user;await loadDashboard();}catch(error){renderLogin(error.message);}return;}const form=event.target.closest("[data-settings]");if(form){event.preventDefault();const note=form.querySelector("[data-settings-message]");try{const value=JSON.parse(form.querySelector("textarea").value);const payload=await api("/api/admin/settings",{method:"PUT",headers:jsonHeaders,body:JSON.stringify({settings:value})});settings=payload;note.textContent="设置已保存，从下一次任务开始生效。";note.className="message ok";}catch(error){note.textContent=error.message;note.className="message error";}return;}const secretForm=event.target.closest("[data-secret]");if(secretForm){event.preventDefault();const note=secretForm.querySelector("[data-secret-message]");try{secret=await api("/api/admin/secrets",{method:"PUT",headers:jsonHeaders,body:JSON.stringify({api_key:secretForm.querySelector("input").value})});secretForm.querySelector("input").value="";renderSecret();note.textContent="密钥已保存。";note.className="message ok";}catch(error){note.textContent=error.message;note.className="message error";}return;}});
document.addEventListener("click",async event=>{const reload=event.target.closest("[data-reload]");if(reload){boot();return;}const status=event.target.closest("[data-user-status]");const role=event.target.closest("[data-user-role]");if(status||role){const id=(status||role).dataset[status?"userStatus":"userRole"];const body=status?{status:status.dataset.status}:{role:role.dataset.role};try{await api(`/api/admin/users/${id}`,{method:"PATCH",headers:jsonHeaders,body:JSON.stringify(body)});users=(await api("/api/admin/users")).users||[];renderUsers();}catch(error){alert(error.message);}return;}const reset=event.target.closest("[data-reset-settings]");if(reset&&confirm("删除设置覆盖并恢复项目默认配置？")){try{settings=await api("/api/admin/settings",{method:"DELETE"});renderSettings();}catch(error){alert(error.message);}}const test=event.target.closest("[data-test-ai]");if(test){test.disabled=true;try{const result=await api("/api/admin/ai/test",{method:"POST"});alert(`连接正常 · ${result.latency_ms} ms · ${result.model}`);}catch(error){alert(error.message);}finally{test.disabled=false;}}const clear=event.target.closest("[data-clear-secret]");if(clear&&confirm("确认清除系统密钥库中的 API Key？")){try{secret=await api("/api/admin/secrets",{method:"DELETE"});renderSecret();}catch(error){alert(error.message);}}});
boot();
</script>
</body>
</html>
