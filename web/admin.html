<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Atlas · 管理后台</title>
<link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico">
<link rel="preload" href="/fonts/EBGaramond.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/fonts/EBGaramond-Italic.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/typography.css">
<style>
:root{
  --bg:#0f0d0a; --bg2:#15120e; --panel:#1a1611; --ink:#eae3d6; --dim:#a39a88; --faint:#6e6759;
  --line:#2b251d; --line2:#3a3226; --acc:#c8622f; --gold:#c9a227;
  --ok:#8fce9b; --warn:#d9b96a; --danger:#d98a7a;
  --serif:var(--font-stack); --mono:var(--font-stack); --sans:var(--font-stack);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-gutter:stable}
@supports not (scrollbar-gutter:stable){html{overflow-y:scroll}}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs-16);line-height:1.6;font-variant-numeric:lining-nums;font-size-adjust:.5;font-variation-settings:"wght" 520;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
::selection{background:var(--acc);color:#fff}
/* 系统控件接管：自动填充、密码按钮、数字步进、滚动条 */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,input:-webkit-autofill:active{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 1000px var(--panel) inset;box-shadow:0 0 0 1000px var(--panel) inset;caret-color:var(--ink);transition:background-color 600000s 0s,color 600000s 0s}
input::-ms-reveal,input::-ms-clear{display:none}
input[type=password]::-webkit-credentials-auto-fill-button,input[type=password]::-webkit-strong-password-auto-fill-button{visibility:hidden;display:none!important;pointer-events:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=text],input[type=password],input[type=email],input[type=url],input[type=number],input[type=tel],textarea{-webkit-appearance:none;appearance:none;border-radius:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}
::-webkit-scrollbar-corner{background:var(--bg)}
html{scrollbar-width:thin;scrollbar-color:var(--line2) var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding:0 40px;width:100%}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,13,10,.94);backdrop-filter:blur(8px);z-index:20;flex:none}
.hd{height:60px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--serif);font-size:var(--fs-20);letter-spacing:.12em}
.logo em{color:var(--acc);font-style:normal}
.nav{display:flex;align-items:center;gap:22px;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.nav a:hover{color:var(--ink)}
.kicker{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.28em;color:var(--faint);text-transform:uppercase}
.kicker b{color:var(--acc);font-weight:400}
main#app{flex:1 0 auto;display:flex;flex-direction:column}
footer{border-top:1px solid var(--line);padding:30px 0 40px;margin-top:auto;flex:none}
.ft{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.2em;color:var(--faint);text-transform:uppercase;line-height:2.2}
.loading{min-height:40vh;display:grid;place-items:center;color:var(--dim);font-family:var(--mono);font-size:var(--fs-14);letter-spacing:.08em}
/* login screen */
.login{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);gap:56px;align-items:center;padding:56px 0 72px}
.login-copy .kicker{display:flex;align-items:center;gap:14px}
.login-copy .kicker::after{content:"";width:150px;height:1px;background:var(--line)}
.login h1{font-family:var(--serif);font-weight:500;font-size:clamp(44px,4.6vw,68px);line-height:1.06;letter-spacing:-.015em;margin:24px 0 20px}
.login-lede{max-width:520px;color:var(--dim);font-size:var(--fs-18);line-height:1.85}
.login-points{list-style:none;margin-top:28px;border-top:1px solid var(--line);max-width:540px}
.login-points li{display:flex;gap:16px;align-items:baseline;border-bottom:1px solid var(--line);padding:13px 0;color:var(--dim);font-size:var(--fs-16)}
.login-points b{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.18em;color:var(--faint);font-weight:400}
.login-card{border:1px solid var(--line2);background:var(--bg2);padding:34px 32px;box-shadow:0 36px 90px rgba(0,0,0,.5);position:relative}
.login-card::before{content:"";position:absolute;top:-1px;left:-1px;right:-1px;height:2px;background:linear-gradient(90deg,var(--acc),transparent 65%)}
.login-card h2{font-family:var(--serif);font-weight:500;font-size:var(--fs-30);margin:14px 0 8px}
.login-card .card-note{color:var(--dim);font-size:var(--fs-14);line-height:1.8}
.field{display:grid;gap:7px;margin:16px 0}
.field label{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.field input,.field textarea{width:100%;font:inherit;font-family:var(--mono);font-size:var(--fs-14);color:var(--ink);background:var(--panel);border:1px solid var(--line2);padding:12px 13px;outline:none;transition:border-color .16s}
.field textarea{min-height:120px;resize:vertical;line-height:1.7}
.field input:focus,.field textarea:focus{border-color:var(--acc)}
.field .hint{font-family:var(--mono);font-size:var(--fs-12);color:var(--faint);line-height:1.7}
.input-wrap{position:relative;display:block}
.input-wrap input{width:100%;padding-right:64px}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.14em;color:var(--faint);background:none;border:0;cursor:pointer;padding:4px}
.eye:hover{color:var(--acc)}
.remember{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.08em;color:var(--dim);cursor:pointer;user-select:none;margin:-4px 0 4px}
.remember input{-webkit-appearance:none;appearance:none;width:15px;height:15px;border:1px solid var(--line2);background:var(--panel);margin:0;cursor:pointer;position:relative;flex:none;transition:border-color .16s,background .16s}
.remember input:hover{border-color:var(--acc)}
.remember input:checked{border-color:var(--acc);background:var(--acc)}
.remember input:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.remember input:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.btn{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.16em;text-transform:uppercase;padding:11px 16px;border:1px solid var(--line2);color:var(--dim);cursor:pointer;background:none;transition:color .16s,border-color .16s,background .16s}
.btn:hover{color:var(--ink);border-color:var(--acc)}
.btn.primary{border-color:var(--acc);color:var(--acc)}
.btn.primary:hover{background:var(--acc);color:#fff}
.btn.danger{border-color:#572d24;color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);color:#fff;background:#572d24}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;min-height:46px}
.btn.tiny{font-size:var(--fs-12);padding:6px 9px;letter-spacing:.1em}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.message{font-family:var(--mono);font-size:var(--fs-12);line-height:1.7;color:var(--dim);min-height:18px}
.message.error{color:var(--danger)}
.message.ok{color:var(--ok)}
/* console */
.console{flex:1;display:flex;flex-direction:column;padding:40px 0 64px}
.console-head{padding-bottom:22px;border-bottom:1px solid var(--line)}
.console-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(36px,3.6vw,52px);line-height:1.08;margin:16px 0 10px}
.console-meta{color:var(--dim);font-size:var(--fs-14)}
.console-body{display:grid;grid-template-columns:220px minmax(0,1fr);gap:34px;align-items:start;padding-top:26px}
.side{position:sticky;top:86px;display:flex;flex-direction:column;gap:6px}
.side-item{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.14em;color:var(--faint);background:none;border:0;border-left:1px solid var(--line);padding:11px 14px;text-align:left;cursor:pointer}
.side-item b{font-weight:400;color:var(--faint)}
.side-item:hover{color:var(--ink)}
.side-item.on{color:var(--ink);border-left-color:var(--acc);background:var(--bg2)}
.side-item.on b{color:var(--acc)}
.side-foot{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.side-link{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.16em;color:var(--faint);background:none;border:0;padding:0;cursor:pointer;text-transform:uppercase}
.side-link:hover{color:var(--acc)}
.content{display:flex;flex-direction:column;gap:22px;min-width:0}
.panel{border:1px solid var(--line);background:var(--bg2);padding:26px 26px 30px}
.panel[hidden]{display:none}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
.panel-head h2{font-family:var(--serif);font-weight:500;font-size:var(--fs-28)}
.panel-note{color:var(--dim);font-size:var(--fs-14);line-height:1.7;margin-top:4px}
.badge{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.14em;padding:3px 8px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.badge.ok{border-color:#2f4a35;color:var(--ok)}
.badge.role{border-color:#5c5220;color:var(--gold)}
.sub-title{font-family:var(--serif);font-weight:500;font-size:var(--fs-22);margin:4px 0 8px}
.rule{border-top:1px solid var(--line);margin:26px 0}
.user-table{width:100%;border-collapse:collapse;font-size:var(--fs-14)}
.user-table th,.user-table td{text-align:left;vertical-align:middle;border-top:1px solid var(--line);padding:11px 8px}
.user-table th{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.12em;color:var(--faint);font-weight:400;text-transform:uppercase}
.user-name{display:flex;align-items:center;gap:10px}
.u-avatar{width:26px;height:26px;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--serif);font-size:var(--fs-14);color:var(--dim);text-transform:uppercase;flex:none}
.state{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.12em;padding:3px 8px;border:1px solid #2f4a35;color:var(--ok)}
.state.off{border-color:#572d24;color:var(--danger)}
.user-actions{display:flex;gap:7px;flex-wrap:wrap}
.secret-state{font-family:var(--mono);font-size:var(--fs-12);color:var(--dim);padding:10px 12px;border:1px solid var(--line);background:var(--panel);line-height:1.8;word-break:break-word}
.secret-state.warn{border-color:#5c5220;color:var(--warn)}
.history-entries{margin-top:6px}
.history-entries summary{cursor:pointer;font-family:var(--mono);font-size:var(--fs-12);color:var(--faint);letter-spacing:.08em}
.history-entries summary:hover{color:var(--dim)}
.history-entry{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:var(--fs-12);color:var(--dim);padding:4px 0}
.history-entry .btn{margin-left:auto}
/* settings form */
.setting-group{border-top:1px solid var(--line);padding-top:20px;margin-top:22px}
.setting-group:first-of-type{border-top:0;padding-top:0;margin-top:0}
.setting-group h3{font-family:var(--serif);font-weight:500;font-size:var(--fs-22);margin-bottom:4px}
.setting-group .group-note{color:var(--dim);font-size:var(--fs-14);line-height:1.7;margin-bottom:16px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
.settings-grid .wide{grid-column:1 / -1}
/* 自建下拉 */
.select{position:relative;display:block}
.select-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;font:inherit;font-family:var(--mono);font-size:var(--fs-14);color:var(--ink);background:var(--panel);border:1px solid var(--line2);padding:12px 13px;text-align:left;cursor:pointer}
.select-btn:hover{border-color:var(--acc)}
.select-btn[aria-expanded=true]{border-color:var(--acc)}
.select-arrow{color:var(--faint);font-size:var(--fs-12)}
.select-menu{position:absolute;z-index:40;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line2);box-shadow:0 24px 60px rgba(0,0,0,.6);max-height:260px;overflow:auto}
.select-menu[hidden]{display:none}
.select-option{padding:10px 13px;font-family:var(--mono);font-size:var(--fs-14);color:var(--dim);cursor:pointer}
.select-option:hover{background:var(--bg2);color:var(--ink)}
.select-option.on{color:var(--acc)}
.select-option.on:hover{background:rgba(200,98,47,.12);color:var(--acc)}
/* dialogs */
.dialog-backdrop{position:fixed;inset:0;z-index:90;background:rgba(10,8,6,.86);backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;animation:fade .16s ease-out}
.dialog{width:min(560px,100%);max-height:min(90vh,860px);display:flex;flex-direction:column;border:1px solid var(--line2);background:var(--bg2);box-shadow:0 40px 100px rgba(0,0,0,.6)}
.dialog.wide{width:min(900px,100%)}
.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:22px 24px 16px;border-bottom:1px solid var(--line)}
.dialog-head h2{font-family:var(--serif);font-weight:500;font-size:var(--fs-26)}
.dialog-head p{font-family:var(--mono);font-size:var(--fs-12);color:var(--faint);line-height:1.7;margin-top:6px}
.dialog-close{font-family:var(--serif);font-size:var(--fs-26);line-height:1;color:var(--dim);border:0;background:none;cursor:pointer;padding:2px 6px}
.dialog-close:hover{color:var(--acc)}
.dialog-body{padding:20px 24px;overflow:auto}
.dialog-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:16px 24px 22px;border-top:1px solid var(--line)}
.dialog-body .field:first-child{margin-top:0}
.runs-table{width:100%;border-collapse:collapse;font-size:var(--fs-14)}
.runs-table th,.runs-table td{text-align:left;border-top:1px solid var(--line);padding:9px 8px;vertical-align:middle}
.runs-table th{font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.12em;color:var(--faint);font-weight:400;text-transform:uppercase}
.runs-table tbody tr:hover{background:var(--bg2)}
.code-area{width:100%;min-height:420px;font-family:var(--mono);font-size:var(--fs-14);color:var(--ink);background:var(--panel);border:1px solid var(--line2);padding:13px;outline:none;resize:vertical;line-height:1.6}
.code-area:focus{border-color:var(--acc)}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.08em;padding:13px 22px;transition:.28s;z-index:99;pointer-events:none;max-width:80vw;opacity:0}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#toast.ok{border-color:#2f4a35}
#toast.error{border-color:#572d24}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){#toast,.dialog-backdrop{transition:none;animation:none}}
@media(max-width:900px){
  .wrap{padding:0 22px}
  .login{grid-template-columns:1fr;gap:30px;padding:34px 0 48px}
  .login h1{font-size:clamp(38px,10vw,54px)}
  .console{padding:28px 0 48px}
  .console-body{grid-template-columns:1fr;gap:18px}
  .side{position:static;flex-direction:row;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
  .side-item{border-left:0;border-bottom:1px solid transparent;padding:8px 10px}
  .side-item.on{border-bottom-color:var(--acc)}
  .side-foot{flex-direction:row;align-items:center;border-top:0;padding-top:0;margin-top:0;gap:16px}
  .panel{padding:20px 18px 24px}
  .settings-grid{grid-template-columns:1fr}
  .user-table thead{display:none}
  .user-table,.user-table tbody,.user-table tr,.user-table td{display:block;width:100%}
  .user-table tr{border-top:1px solid var(--line);padding:12px 0}
  .user-table td{border:0;padding:5px 0;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .user-table td::before{content:attr(data-label);font-family:var(--mono);font-size:var(--fs-12);letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
}
</style>
</head>
<body>
<header><div class="wrap hd"><a class="logo" href="/">MUSIC <em>ATLAS</em></a><div class="nav"><span>管理后台</span><a href="/">返回主页 ↗</a></div></div></header>
<main id="app"><div class="loading">正在读取后台状态…</div></main>
<footer><div class="wrap ft"><span>MUSIC ATLAS · 管理后台</span><span>仅管理员可见</span></div></footer>
<div id="toast"></div>
<div id="dialog-root"></div>
<script>
"use strict";
const app=document.getElementById("app");
const esc=value=>String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");
let admin=null,users=[],settings=null,schema=[],secret=null,historyItems=[],settingsDirty=false;
const jsonHeaders={"Content-Type":"application/json"};
let toastTimer=null;
function toast(text,kind=""){const node=document.getElementById("toast");node.textContent=text;node.className="on "+(kind||"");clearTimeout(toastTimer);toastTimer=setTimeout(()=>{node.className=kind||"";},2600);}
function confirmDialog({title,text,confirmText="确认",danger=false}){const root=openDialog({title,body:`<p class="panel-note" style="margin:0">${esc(text)}</p>`,footer:`<button class="btn" type="button" data-confirm-cancel>取消</button><button class="btn ${danger?"danger":"primary"}" type="button" data-confirm-ok>${esc(confirmText)}</button>`});return new Promise(resolve=>{root.addEventListener("click",event=>{if(event.target.closest("[data-confirm-ok]")){closeDialog();resolve(true);}else if(event.target.closest("[data-confirm-cancel]")||event.target.closest("[data-dialog-close]")||event.target.matches("[data-dialog-backdrop]")){closeDialog();resolve(false);}});});}
function openDialog({title,note="",body="",footer="",wide=false}){const root=document.getElementById("dialog-root");root.innerHTML=`<div class="dialog-backdrop" data-dialog-backdrop><section class="dialog ${wide?"wide":""}" role="dialog" aria-modal="true"><div class="dialog-head"><div><h2>${esc(title)}</h2>${note?`<p>${esc(note)}</p>`:""}</div><button type="button" class="dialog-close" data-dialog-close aria-label="关闭">×</button></div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-foot">${footer}</div>`:""}</section></div>`;return root;}
function closeDialog(){const root=document.getElementById("dialog-root");if(root)root.innerHTML="";}
async function api(url,options={}){const response=await fetch(url,{cache:"no-store",...options});let payload=null;try{payload=await response.json();}catch{}if(!response.ok||!payload?.ok){if(response.status===401&&admin){admin=null;renderLogin("登录状态已失效，请重新登录");}throw new Error(payload?.error||`请求失败（${response.status}）`);}return payload;}
function getByPath(obj,path){return path.split(".").reduce((node,key)=>node==null?undefined:node[key],obj);}
function setByPath(obj,path,value){const keys=path.split(".");let node=obj;for(const key of keys.slice(0,-1)){if(!node[key]||typeof node[key]!=="object")node[key]={};node=node[key];}node[keys[keys.length-1]]=value;}
function effortLabel(value){return {off:"关闭（最快）",low:"低",medium:"中",high:"高",max:"最大（max）"}[value]||value;}
function readThinking(source){const compat=source?.runtime?.openai_compat||{};if(compat.disable_thinking!==false)return "off";const effort=String(source?.runtime?.codex_reasoning_effort||"").toLowerCase();return ["low","medium","high","max"].includes(effort)?effort:"low";}

ecret-message aria-live="polite"></div><div class="actions"><button class="btn primary" type="submit">保存密钥</button><button class="btn" type="button" data-test-ai>测试连接</button><button class="btn danger" type="button" data-clear-secret>清除密钥</button></div></form></section><section class="panel" data-panel="history" hidden><div class="panel-head"><div><h2>推荐去重</h2><p class="panel-note">近 7 天的推荐去重缓存；清除后相关曲目可能被再次推荐。</p></div><div class="actions" style="margin:0"><button class="btn" type="button" data-history-refresh>刷新</button></div></div><div id="history"><div class="loading">正在读取去重缓存…</div></div></section></div></div></div>`;renderUsers();renderSettingsForm();renderSecret();renderHistory();}
function renderUsers(){const root=document.getElementById("users");if(!root)return;if(!users.length){root.innerHTML='<p class="panel-note">暂无注册用户。</p>';return;}root.innerHTML=`<table class="user-table"><thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>运行</th><th>成功率</th><th>最近运行</th><th>最近登录</th><th>操作</th></tr></thead><tbody>${users.map(user=>{const stats=user.run_stats||{};const rate=((stats.completed||0)+(stats.failed||0))?Math.round((stats.completed||0)/((stats.completed||0)+(stats.failed||0))*100)+"%":"—";return `<tr><td data-label="用户名"><span class="user-name"><span class="u-avatar">${esc((user.username||"?").slice(0,1))}</span>${esc(user.username)}</span></td><td data-label="角色"><span class="badge ${user.role==="admin"?"role":""}">${user.role==="admin"?"管理员":"用户"}</span></td><td data-label="状态"><span class="state ${user.status!=="enabled"?"off":""}">${user.status==="enabled"?"启用":"停用"}</span></td><td data-label="运行">${stats.total||0}</td><td data-label="成功率">${rate}</td><td data-label="最近运行">${esc((stats.last_started||"").replace("T"," ").slice(0,16))||"—"}</td><td data-label="最近登录">${esc((user.last_login_at||"").replace("T"," ").slice(0,16))||"—"}</td><td data-label="操作"><div class="user-actions"><button class="btn tiny" data-user-edit="${user.id}">编辑</button><button class="btn tiny" data-user-password="${user.id}">改密</button><button class="btn tiny ${user.status==="enabled"?"danger":""}" data-user-status="${user.id}" data-status="${user.status==="enabled"?"disabled":"enabled"}">${user.status==="enabled"?"停用":"启用"}</button><button class="btn tiny" data-user-runs="${user.id}">运行记录</button>${user.id!==admin.id?`<button class="btn tiny danger" data-user-delete="${user.id}">删除</button>`:""}</div></td></tr>`;}).join("")}</tbody></table>`;}
function renderField(field,value){const id=`f-${field.path.replace(/\./g,"-")}`;const label=`<label for="${id}">${esc(field.label)}</label>`;const hint=field.help?`<span class="hint">${esc(field.help)}</span>`:"";if(field.type==="number"){const v=value===null||value===undefined?"":esc(value);return `<div class="field">${label}<input id="${id}" type="number" data-field="${field.path}" data-kind="number" value="${v}" ${field.min!==undefined?`min="${field.min}"`:""} ${field.max!==undefined?`max="${field.max}"`:""} ${field.step?`step="${field.step}"`:""}>${hint}</div>`;}if(field.type==="textarea"){return `<div class="field wide">${label}<textarea id="${id}" data-field="${field.path}" data-kind="text" ${field.maxlength?`maxlength="${field.maxlength}"`:""}>${esc(value??"")}</textarea>${hint}</div>`;}if(field.type==="select"){const current=String(value??"");const options=(field.options||[]).map(([val,text])=>`<div class="select-option ${String(val)===current?"on":""}" data-select-value="${esc(String(val))}">${esc(text)}</div>`).join("");const labelText=(field.options||[]).find(([val])=>String(val)===current)?.[1]||current;return `<div class="field">${label}<div class="select" data-select data-field="${field.path}"><button type="button" class="select-btn" aria-haspopup="listbox" aria-expanded="false"><span class="select-value">${esc(labelText)}</span><span class="select-arrow">▾</span></button><input type="hidden" value="${esc(current)}"><div class="select-menu" role="listbox" hidden>${options}</div></div>${hint}</div>`;}const v=value===null||value===undefined?"":esc(value);return `<div class="field">${label}<input id="${id}" type="text" data-field="${field.path}" data-kind="text" value="${v}" ${field.placeholder?`placeholder="${esc(field.placeholder)}"`:""}>${hint}</div>`;}
function renderSettingsForm(){const root=document.getElementById("settings-form");if(!root||!settings)return;root.innerHTML=schema.map((group,index)=>`<section class="setting-group" data-group="${esc(group.group)}"><h3>${esc(group.title)}</h3>${group.note?`<p class="group-note">${esc(group.note)}</p>`:""}<div class="settings-grid">${group.fields.map(field=>{const value=field.path==="thinking"?readThinking(settings):getByPath(settings,field.path);const html=renderField(field,value);return field.type==="textarea"?html:html;}).join("")}</div></section>`).join("");settingsDirty=false;const note=document.querySelector("[data-settings-message]");if(note){note.textContent="";note.className="message";}}
function collectSettings(){const patch={};document.querySelectorAll("#settings-form [data-field]").forEach(node=>{const path=node.dataset.field;if(path==="thinking")return;const kind=node.dataset.kind;let value;if(node.classList.contains("select")){value=node.querySelector("input[type=hidden]").value;}else{value=node.value;}if(kind==="number"){if(value===""||value===null){setByPath(patch,path,null);return;}value=Number(value);}else if(String(value).trim()===""){return;}setByPath(patch,path,value);});const thinking=document.querySelector("#settings-form [data-select][data-field=thinking] input[type=hidden]")?.value;if(thinking==="off"){const compat=patch.runtime?.openai_compat||{};setByPath(patch,"runtime.openai_compat",{...compat,disable_thinking:true});}else if(thinking){const compat=patch.runtime?.openai_compat||{};setByPath(patch,"runtime.openai_compat",{...compat,disable_thinking:false});setByPath(patch,"runtime.codex_reasoning_effort",thinking);}return patch;}

 if(historyPrune){const item=historyItems[Number(historyPrune.dataset.historyPrune)];if(item){try{const result=await api(`/api/admin/recommendation-history/${encodeURIComponent(item.file)}/prune`,{method:"POST"});toast(`已清理 ${result.removed} 条过期记录`,"ok");await reloadHistory();}catch(error){toast(error.message,"error");}}return;}
 const historyClear=event.target.closest("[data-history-clear]");
 if(historyClear){const item=historyItems[Number(historyClear.dataset.historyClear)];if(item){const label=item.playlist?.name||item.playlist?.playlist_id||item.file;if(!await confirmDialog({title:"清除去重缓存",text:`确认清除「${label}」的全部去重记录？相关曲目可能被再次推荐。`,confirmText:"清除",danger:true}))return;try{await api(`/api/admin/recommendation-history/${encodeURIComponent(item.file)}`,{method:"DELETE"});toast("已清除","ok");await reloadHistory();}catch(error){toast(error.message,"error");}}return;}
 const historyEntry=event.target.closest("[data-history-entry]");
 if(historyEntry){const item=historyItems[Number(historyEntry.dataset.historyEntry)];const stamp=historyEntry.dataset.historyStamp;if(item&&stamp){if(!await confirmDialog({title:"清除单次记录",text:"确认放回该次推荐产生的去重条目？",confirmText:"清除",danger:true}))return;try{await api(`/api/admin/recommendation-history/${encodeURIComponent(item.file)}/entries/${encodeURIComponent(stamp)}`,{method:"DELETE"});toast("已清除该次记录","ok");await reloadHistory();}catch(error){toast(error.message,"error");}}return;}
 const createBtn=event.target.closest("[data-user-create]");if(createBtn){openUserDialog(null);return;}
 const editBtn=event.target.closest("[data-user-edit]");if(editBtn){const user=users.find(u=>u.id===Number(editBtn.dataset.userEdit));if(user)openUserDialog(user);return;}
 const passBtn=event.target.closest("[data-user-password]");if(passBtn){const user=users.find(u=>u.id===Number(passBtn.dataset.userPassword));if(user)openPasswordDialog(user);return;}
 const runsBtn=event.target.closest("[data-user-runs]");if(runsBtn){const user=users.find(u=>u.id===Number(runsBtn.dataset.userRuns));if(user)openRunsDialog(user);return;}
 const submitBtn=event.target.closest("[data-user-submit]");
 if(submitBtn){const form=document.querySelector("[data-user-form]");const note=form.querySelector("[data-user-message]");const id=form.dataset.id;const username=form.querySelector("#user-name").value.trim();const role=form.querySelector("[data-field=role] input[type=hidden]").value;try{submitBtn.disabled=true;if(id){await api(`/api/admin/users/${id}`,{method:"PATCH",headers:jsonHeaders,body:JSON.stringify({username,role})});toast("账号已更新","ok");}else{const password=form.querySelector("#user-pass").value;await api("/api/admin/users",{method:"POST",headers:jsonHeaders,body:JSON.stringify({username,password,role})});toast("账号已创建","ok");}users=(await api("/api/admin/users")).users||[];renderUsers();closeDialog();}catch(error){if(note){note.textContent=error.message;note.className="message error";}submitBtn.disabled=false;}return;}
 const passSubmit=event.target.closest("[data-password-submit]");
 if(passSubmit){const form=document.querySelector("[data-password-form]");const note=form.querySelector("[data-password-message]");try{passSubmit.disabled=true;await api(`/api/admin/users/${form.dataset.id}`,{method:"PATCH",headers:jsonHeaders,body:JSON.stringify({password:form.querySelector("#new-pass").value})});toast("密码已更新","ok");closeDialog();}catch(error){if(note){note.textContent=error.message;note.className="message error";}passSubmit.disabled=false;}return;}
 const status=event.target.closest("[data-user-status]");
 if(status){const id=status.dataset.userStatus;try{await api(`/api/admin/users/${id}`,{method:"PATCH",headers:jsonHeaders,body:JSON.stringify({status:status.dataset.status})});users=(await api("/api/admin/users")).users||[];renderUsers();toast(status.dataset.status==="disabled"?"账号已停用":"账号已启用","ok");}catch(error){toast(error.message,"error");}return;}
 const del=event.target.closest("[data-user-delete]");
 if(del){const user=users.find(u=>u.id===Number(del.dataset.userDelete));if(!user)return;if(!await confirmDialog({title:"删除账号",text:`确认硬删除账号 ${user.username}？其歌单、偏好与会话将一并删除，审计记录保留。此操作不可撤销。`,confirmText:"删除",danger:true}))return;try{await api(`/api/admin/users/${user.id}`,{method:"DELETE"});users=(await api("/api/admin/users")).users||[];renderUsers();toast("账号已删除","ok");}catch(error){toast(error.message,"error");}return;}
 const jsonOpen=event.target.closest("[data-json-open]");if(jsonOpen){openJsonDialog();return;}
 const jsonFormat=event.target.closest("[data-json-format]");
 if(jsonFormat){const area=document.querySelector("[data-json-area]");try{area.value=JSON.stringify(JSON.parse(area.value),null,2);toast("已格式化","ok");}catch(error){toast("JSON 不合法："+error.message,"error");}return;}
 const jsonSubmit=event.target.closest("[data-json-submit]");
 if(jsonSubmit){const area=document.querySelector("[data-json-area]");const note=document.querySelector("[data-json-message]");try{const value=JSON.parse(area.value);jsonSubmit.disabled=true;const payload=await api("/api/admin/settings",{method:"PUT",headers:jsonHeaders,body:JSON.stringify({settings:value})});settings=payload.settings||settings;renderSettingsForm();closeDialog();toast("JSON 已保存","ok");}catch(error){if(note){note.textContent=error instanceof SyntaxError?"JSON 不合法："+error.message:error.message;note.className="message error";}jsonSubmit.disabled=false;}return;}
 const format=event.target.closest("[data-format-settings]");if(format){return;}
 const reset=event.target.closest("[data-reset-settings]");
 if(reset){if(!await confirmDialog({title:"恢复默认覆盖",text:"删除设置覆盖并恢复项目默认配置？此操作立即生效。",confirmText:"恢复默认",danger:true}))return;try{const payload=await api("/api/admin/settings",{method:"DELETE"});settings=payload.settings||{};renderSettingsForm();toast("已恢复默认配置","ok");}catch(error){toast(error.message,"error");}return;}
 const test=event.target.closest("[data-test-ai]");
 if(test){const note=document.querySelector("[data-secret-message]");test.disabled=true;if(note){note.textContent="正在测试连接…";note.className="message";}try{const result=await api("/api/admin/ai/test",{method:"POST"});if(note){note.textContent=`连接正常 · ${result.latency_ms} ms · ${result.model}`;note.className="message ok";}toast("连接正常","ok");}catch(error){if(note){note.textContent="连接失败："+error.message;note.className="message error";}toast("连接失败","error");}finally{test.disabled=false;}return;}
 const clear=event.target.closest("[data-clear-secret]");
 if(clear){if(!await confirmDialog({title:"清除 API Key",text:"确认清除系统密钥库中的 API Key？清除后需要重新配置才能运行工作流。",confirmText:"清除",danger:true}))return;try{secret=await api("/api/admin/secrets",{method:"DELETE"});renderSecret();toast("密钥已清除","ok");}catch(error){toast(error.message,"error");}}
});
document.addEventListener("keydown",event=>{if(event.key==="Escape"){const select=document.querySelector(".select-menu:not([hidden])");if(select){select.hidden=true;return;}closeDialog();}});
boot();
</script>
</body>
</html>
